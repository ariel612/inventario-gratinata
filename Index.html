<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Gratinata"/>
<title>Inventario — Gratinata Pizza</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;padding-bottom:90px}
.header{background:#fff;padding:14px 16px 10px;border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:10}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header h1{font-size:17px;font-weight:600}
.header .fecha{font-size:12px;color:#888;text-transform:capitalize}
.save-msg{font-size:12px;color:#22c55e;min-width:80px;text-align:right}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:8px 0;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:14px;cursor:pointer;color:#666;font-weight:400}
.tab.active{border:1.5px solid #3b82f6;background:#eff6ff;color:#1d4ed8;font-weight:500}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.progress-bar{height:5px;background:#e5e5e5;border-radius:99px}
.progress-fill{height:5px;background:#3b82f6;border-radius:99px;transition:width .3s}
.section{padding:0 16px}
.proveedor-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;padding:10px 0 4px}
.item-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0}
.item-info{flex:1;min-width:0}
.item-nombre{font-size:13px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-nombre.procesado{color:#aaa}
.item-min{font-size:11px;color:#888}
.item-min.bajo{color:#ef4444}
.checkbox{width:20px;height:20px;border-radius:4px;border:1px solid #ccc;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff}
.checkbox.checked{border-color:#22c55e;background:#f0fdf4}
.checkbox.checked::after{content:'✓';font-size:13px;color:#22c55e}
input[type=number]{width:62px;text-align:center;font-size:14px;padding:5px 6px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a}
input[type=number].bajo{border-color:#ef4444}
.admin-panel{padding:0 16px 12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.summary-card{background:#fff;border-radius:10px;padding:12px}
.summary-card .label{font-size:12px;color:#888;margin-bottom:4px}
.summary-card .value{font-size:22px;font-weight:600}
.value.danger{color:#ef4444}
.value.ok{color:#22c55e}
.alert-box{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.alert-title{font-size:13px;font-weight:600;color:#dc2626;margin-bottom:6px}
.alert-item{font-size:12px;color:#dc2626;padding:2px 0}
.admin-tabs{display:flex;gap:6px;margin-bottom:10px}
.admin-tab{flex:1;padding:6px 0;font-size:13px;border-radius:8px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666}
.admin-tab.active{border:1.5px solid #3b82f6;background:#eff6ff;color:#1d4ed8;font-weight:500}
.add-form{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px}
.add-form .form-title{font-size:13px;font-weight:600;margin-bottom:10px}
.field{margin-bottom:8px}
.field label{font-size:12px;color:#888;display:block;margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;font-size:14px;background:#fff;color:#1a1a1a}
.btn{width:100%;padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;border:none;margin-top:4px}
.btn-primary{background:#3b82f6;color:#fff;font-weight:500}
.btn-secondary{background:#fff;color:#444;border:1px solid #ddd}
.edit-btns{display:flex;gap:6px;flex-shrink:0}
.btn-edit{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333;cursor:pointer}
.btn-del{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;cursor:pointer}
.diff{font-size:11px;flex-shrink:0}
.diff.up{color:#22c55e}
.diff.down{color:#ef4444}
.footer{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:#fff;border-top:1px solid #e5e5e5}
.footer-inner{max-width:480px;margin:0 auto;display:flex;gap:8px;align-items:center}
.footer-count{flex:1;font-size:12px;color:#888}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:#888;font-size:14px}
</style>
</head>
<body>

<div id="app"><div class="loading">Cargando inventario...</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyB9reUnHGDLL2PQeZ2fzU2MmDSZzcKi-as",
  authDomain: "inventario-gratinata.firebaseapp.com",
  projectId: "inventario-gratinata",
  storageBucket: "inventario-gratinata.firebasestorage.app",

  appId: "1:191809403412:web:d024e41463066bbdf58501"

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const INVENTARIO_DEFAULT = [
  { proveedor:"CAVELI", items:[
    {nombre:"Alcohol caja 20 lt",min:1},{nombre:"Alusa",min:1},
    {nombre:"Queso cabra Holandia despunte kg",min:8},{nombre:"Mantequilla Kumet caja",min:1},
    {nombre:"Pieza jamón art. Victoria 2,5 kg",min:4},{nombre:"Cheddar laminado 2,7 kg",min:1},
    {nombre:"Rueda parmesano",min:1},{nombre:"Rueda queso azul Santa Rosa",min:1},
    {nombre:"Salsa soya",min:1},{nombre:"Salsa cheddar Santa Rosa kg",min:5},
    {nombre:"Longaniza kg",min:3},{nombre:"Fondo alcachofa caja 10 uni",min:1},
    {nombre:"Toalla papel pqte 16",min:1},{nombre:"Lavaloza lt",min:2},
    {nombre:"Frambuesa kg",min:7},{nombre:"Mango kg",min:7},{nombre:"Piña kg",min:7},{nombre:"Frutillas kg",min:7}
  ]},
  { proveedor:"BIDFOOD", items:[
    {nombre:"Popcorn pollo kg",min:8},{nombre:"Pepinillo laminado kg",min:2},
    {nombre:"Mostaza Heinz kg",min:2},{nombre:"Tocino laminado ahumado kg",min:18},
    {nombre:"Mayonesa Kraft Real Mayo 3,7 kg",min:4},{nombre:"Sal kg",min:10},
    {nombre:"Aceite oliva Dido 5 lt",min:2},{nombre:"Mechada caja 8 kg",min:3},
    {nombre:"Traperos desechables",min:8},{nombre:"Papas Simplot 7mm caja 8 bolsas",min:32},
    {nombre:"Choclo 500 gr",min:5}
  ]},
  { proveedor:"ICB", items:[
    {nombre:"Pepperoni Sugardele caja 6 kg",min:1},{nombre:"Aceitunas 10 kg",min:1},
    {nombre:"Aros cebolla 6 uni",min:3},{nombre:"BBQ 10 kg",min:1},{nombre:"Sémola kg",min:12},
    {nombre:"Piña rodaja tarro 3 kg",min:1},{nombre:"Cereal Kellogs cj 8 uni",min:1},
    {nombre:"Guantes nitrilo M y S",min:2},{nombre:"Hamburguesa Angus 198gr cj 24 uni",min:5},
    {nombre:"Ajo en polvo kg",min:1}
  ]},
  { proveedor:"GLOBEITALIA", items:[{nombre:"Tarro tomate Divella 4,05 kg",min:21}]},
  { proveedor:"GAG", items:[{nombre:"Camarón 36/40 crudo c/cáscara kg",min:10}]},
  { proveedor:"LEÑA", items:[{nombre:"Sacos",min:25}]},
  { proveedor:"QUIYALLES", items:[{nombre:"Leche entera",min:24},{nombre:"Leche entera sin lactosa",min:12}]},
  { proveedor:"ERICK PALTAS", items:[{nombre:"Paltas kg",min:20}]},
  { proveedor:"OLIVO", items:[
    {nombre:"Bombillas negras 25x200",min:0.1},{nombre:"Esponja lavaloza",min:4},
    {nombre:"Rollo bolsa prepicada 30*40 / 20*30 (c/u)",min:1},{nombre:"Paño pack 3",min:2},
    {nombre:"Rollo térmico 10 uni",min:0.5},{nombre:"Pqte servilletas negras 1200 uni",min:1},
    {nombre:"Harina estampa pizza 20 kg",min:6},{nombre:"Virutilla gruesa olla",min:4},
    {nombre:"Aceite freír Frito Rico",min:3},{nombre:"Papas Simplot 7mm / 8 uni x caja",min:4},
    {nombre:"Bolsa basura 70*90 10 uni",min:5},{nombre:"Guante nitrilo M",min:1},
    {nombre:"Guante nitrilo S",min:1},{nombre:"Jabón 5 lt",min:1},{nombre:"Papel interfoleado 15 uni",min:1}
  ]},
  { proveedor:"SUPERMERCADO", items:[
    {nombre:"Bolsa basura chica baño",min:2},{nombre:"Cloro gel",min:2},
    {nombre:"Confort 9 uni x 50 mt",min:0},{nombre:"Huevos bandeja 30 uni",min:1},
    {nombre:"Levadura",min:1},{nombre:"Bolsas palillos hamburguesa",min:120},
    {nombre:"Fósforos",min:1},{nombre:"Virutilla piso",min:2},{nombre:"Azúcar kg",min:10},
    {nombre:"Nuez moscada",min:2},{nombre:"Paprika",min:1},{nombre:"Vinagre bidón 5 lts",min:1},
    {nombre:"Shitake bolsa estándar",min:2},{nombre:"Champiñones 200 grs",min:15},
    {nombre:"Mangas XL (chinos) 1 pqte",min:1},{nombre:"Bolsas vacío 25*35 (ML) 1 pqte",min:1},
    {nombre:"Marshmallow bolsa",min:2},{nombre:"Hielo 2,5",min:10}
  ]},
  { proveedor:"TRES ARAUCO", items:[{nombre:"Mozzarella Molfino caja 6 uni",min:4}]},
  { proveedor:"PUKARA", items:[{nombre:"Pan papa 12 cm sésamo blanco 36 uni",min:3}]}
];

const weekKey = () => { const d=new Date(),w=Math.ceil(d.getDate()/7); return `${d.getFullYear()}-${d.getMonth()+1}-w${w}`; };
const prevWeekKey = () => { const d=new Date(); d.setDate(d.getDate()-7); const w=Math.ceil(d.getDate()/7); return `${d.getFullYear()}-${d.getMonth()+1}-w${w}`; };
const bk = (p,n) => `${p}||${n}`;

let state = { mode:"cocina", adminTab:"ver", stockData:{}, prevData:{}, catalogo:INVENTARIO_DEFAULT, saveMsg:"", editModal:null, newItem:{proveedor:"",nombre:"",min:""}, addProv:"" };
let saveTimeout = null;

async function loadData() {
  try {
    const [catSnap, stockSnap, prevSnap] = await Promise.all([
      getDoc(doc(db,"gratinata","catalogo")),
      getDoc(doc(db,"stock",weekKey())),
      getDoc(doc(db,"stock",prevWeekKey()))
    ]);
    if (catSnap.exists()) state.catalogo = catSnap.data().items;
    if (stockSnap.exists()) state.stockData = stockSnap.data().entries || {};
    if (prevSnap.exists()) state.prevData = prevSnap.data().entries || {};
  } catch(e) { console.error(e); }
  render();
  // Live sync
  onSnapshot(doc(db,"stock",weekKey()), snap => {
    if (snap.exists()) { state.stockData = snap.data().entries || {}; render(); }
  });
}

async function saveStock() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await db.collection("stock").doc(weekKey()).set({ entries: state.stockData, updatedAt: new Date().toISOString() });
      state.saveMsg = "✓ Guardado";
      render();
      setTimeout(() => { state.saveMsg = ""; render(); }, 2000);
    } catch(e) { state.saveMsg = "Error al guardar"; render(); }
  }, 600);
}

async function saveCatalogo() {
  await db.collection("gratinata").doc("catalogo").set({ items: state.catalogo });
}

function getVal(p,n,f,fb="") { return state.stockData[bk(p,n)]?.[f] ?? fb; }
function getPrev(p,n) { return state.prevData[bk(p,n)]?.stock ?? null; }

function updateStock(p,n,f,v) {
  const k=bk(p,n);
  state.stockData = { ...state.stockData, [k]: { ...(state.stockData[k]||{}), [f]:v } };
  state.saveMsg = "Guardando...";
  render();
  saveStock();
}

function weekLabel() { return new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"}); }

function totalItems() { return state.catalogo.reduce((a,g)=>a+g.items.length,0); }
function filledItems() { return state.catalogo.reduce((a,g)=>a+g.items.filter(i=>getVal(g.proveedor,i.nombre,"stock")!=="").length,0); }
function lowItems() {
  return state.catalogo.flatMap(g=>g.items.filter(i=>{
    const s=parseFloat(getVal(g.proveedor,i.nombre,"stock",""));
    return !isNaN(s)&&i.min>0&&s<i.min;
  }).map(i=>({...i,proveedor:g.proveedor})));
}

function downloadTxt() {
  const lines=["Inventario Semanal — Gratinata Pizza",`Semana: ${new Date().toLocaleDateString("es-CL")}`,""];
  state.catalogo.forEach(g=>{
    lines.push(`== ${g.proveedor} ==`);
    g.items.forEach(i=>{
      const s=getVal(g.proveedor,i.nombre,"stock")||"-";
      const p=getVal(g.proveedor,i.nombre,"procesado",false)?"✓":" ";
      lines.push(`[${p}] ${i.nombre} | Stock: ${s} | Mín: ${i.min}`);
    });
    lines.push("");
  });
  const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url;
  a.download=`inventario_gratinata_${new Date().toISOString().slice(0,10)}.txt`;
  a.click(); URL.revokeObjectURL(url);
}

function render() {
  const t=totalItems(), f=filledItems(), low=lowItems();
  const pct = t>0?Math.round((f/t)*100):0;
  const {mode,adminTab,editModal,newItem,addProv} = state;

  let html = `
  <div class="header">
    <div class="header-top">
      <div><div class="header h1" style="font-size:17px;font-weight:600">Gratinata Pizza</div>
      <div class="fecha">${weekLabel()}</div></div>
      <div class="save-msg">${state.saveMsg}</div>
    </div>
    <div class="tabs">
      <button class="tab ${mode==="cocina"?"active":""}" onclick="setMode('cocina')">🍕 Modo cocina</button>
      <button class="tab ${mode==="administrador"?"active":""}" onclick="setMode('administrador')">📋 Modo administrador</button>
    </div>
    <div class="progress-label"><span>Progreso</span><span>${f}/${t}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;

  if (mode==="administrador") {
    html += `<div class="admin-panel">
      <div class="summary-grid">
        <div class="summary-card"><div class="label">Bajo mínimo</div><div class="value ${low.length>0?"danger":"ok"}">${low.length}</div></div>
        <div class="summary-card"><div class="label">Completado</div><div class="value">${pct}%</div></div>
      </div>`;
    if (low.length>0) {
      html+=`<div class="alert-box"><div class="alert-title">Bajo mínimo</div>`;
      low.forEach(i=>{ html+=`<div class="alert-item">${i.nombre} — stock: ${getVal(i.proveedor,i.nombre,"stock")} / mín: ${i.min} (${i.proveedor})</div>`; });
      html+=`</div>`;
    }
    html+=`<div class="admin-tabs">
      <button class="admin-tab ${adminTab==="ver"?"active":""}" onclick="setAdminTab('ver')">Ver inventario</button>
      <button class="admin-tab ${adminTab==="editar"?"active":""}" onclick="setAdminTab('editar')">Editar/Eliminar</button>
      <button class="admin-tab ${adminTab==="agregar"?"active":""}" onclick="setAdminTab('agregar')">Agregar</button>
    </div>`;

    if (adminTab==="agregar") {
      const provOpts = state.catalogo.map(g=>`<option value="${g.proveedor}">${g.proveedor}</option>`).join("");
      html+=`<div class="add-form"><div class="form-title">Nuevo producto</div>
        <div class="field"><label>Proveedor</label>
          <select id="ni-prov" onchange="niChange('proveedor',this.value)">
            <option value="">— Seleccionar —</option>${provOpts}<option value="__nuevo__">+ Nuevo proveedor</option>
          </select></div>
        ${newItem.proveedor==="__nuevo__"?`<div class="field"><label>Nombre del nuevo proveedor</label><input id="ni-addprov" value="${addProv}" oninput="setAddProv(this.value)" placeholder="PROVEEDOR"/></div>`:""}
        <div class="field"><label>Nombre del producto</label><input id="ni-nom" value="${newItem.nombre}" oninput="niChange('nombre',this.value)" placeholder="Ej: Orégano kg"/></div>
        <div class="field"><label>Mínimo requerido</label><input type="number" min="0" step="0.5" id="ni-min" value="${newItem.min}" oninput="niChange('min',this.value)" placeholder="0"/></div>
        <button class="btn btn-primary" onclick="addItem()">+ Agregar producto</button>
      </div>`;
    }
    html+=`</div>`;
  }

  if (mode==="cocina"||(mode==="administrador"&&(adminTab==="ver"||adminTab==="editar"))) {
    html+=`<div class="section">`;
    state.catalogo.forEach(g=>{
      html+=`<div class="proveedor-label">${g.proveedor}</div>`;
      g.items.forEach(item=>{
        const p=g.proveedor, stock=getVal(p,item.nombre,"stock","");
        const procesado=getVal(p,item.nombre,"procesado",false);
        const prev=getPrev(p,item.nombre);
        const sn=parseFloat(stock);
        const bajo=!isNaN(sn)&&item.min>0&&sn<item.min;
        const diff=(prev!==null&&stock!=="")?(sn-parseFloat(prev)):null;
        const pe=encodeURIComponent(p), ne=encodeURIComponent(item.nombre);

        html+=`<div class="item-row">`;
        if (mode==="cocina") {
          html+=`<div class="checkbox ${procesado?"checked":""}" onclick="toggleProc('${pe}','${ne}')"></div>`;
        }
        html+=`<div class="item-info">
          <div class="item-nombre ${procesado&&mode==="cocina"?"procesado":""}">${item.nombre}</div>
          ${item.min>0?`<div class="item-min ${bajo?"bajo"}">mín: ${item.min}${bajo?" ⚠ bajo mínimo":""}</div>`:""}
        </div>`;
        if (mode==="administrador"&&adminTab==="ver"&&diff!==null) {
          html+=`<span class="diff ${diff>=0?"up":"down"}">${diff>=0?"+":""}${diff.toFixed(1)}</span>`;
        }
        if (mode==="administrador"&&adminTab==="editar") {
          html+=`<div class="edit-btns">
            <button class="btn-edit" onclick="openEdit('${pe}','${ne}',${item.min})">Editar</button>
            <button class="btn-del" onclick="delItem('${pe}','${ne}')">Eliminar</button>
          </div>`;
        } else {
          html+=`<input type="number" min="0" step="0.1" class="${bajo?"bajo":""}" value="${stock}" placeholder="0"
            oninput="updateStk('${pe}','${ne}',this.value)"/>`;
        }
        html+=`</div>`;
      });
    });
    html+=`</div>`;
  }

  // Footer
  if (mode==="cocina") {
    html+=`<div class="footer"><div class="footer-inner">
      <div class="footer-count">${f}/${t} completados</div>
      <button class="btn btn-secondary" style="width:auto;padding:8px 14px" onclick="markAll()">Marcar todos procesados</button>
    </div></div>`;
  }
  if (mode==="administrador"&&adminTab==="ver") {
    html+=`<div class="footer"><div class="footer-inner">
      <button class="btn btn-secondary" onclick="download()">⬇ Descargar inventario (.txt)</button>
    </div></div>`;
  }

  // Edit modal
  if (editModal) {
    html+=`<div class="modal-overlay">
      <div class="modal">
        <div class="modal-title">Editar producto</div>
        <div class="field"><label>Nombre</label><input id="em-nom" value="${editModal.nombre}" oninput="emChange('nombre',this.value)"/></div>
        <div class="field"><label>Mínimo</label><input type="number" min="0" step="0.5" id="em-min" value="${editModal.min}" oninput="emChange('min',this.value)"/></div>
        <div class="modal-btns">
          <button class="btn btn-secondary" onclick="closeEdit()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveEdit()">Guardar</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById("app").innerHTML = html;
}

// Global handlers
window.setMode = v => { state.mode=v; state.adminTab="ver"; render(); };
window.setAdminTab = v => { state.adminTab=v; render(); };
window.updateStk = (pe,ne,v) => updateStock(decodeURIComponent(pe),decodeURIComponent(ne),"stock",v);
window.toggleProc = (pe,ne) => { const p=decodeURIComponent(pe),n=decodeURIComponent(ne); updateStock(p,n,"procesado",!getVal(p,n,"procesado",false)); };
window.markAll = () => { state.catalogo.forEach(g=>g.items.forEach(i=>updateStock(g.proveedor,i.nombre,"procesado",true))); };
window.download = downloadTxt;
window.niChange = (f,v) => { state.newItem={...state.newItem,[f]:v}; render(); };
window.setAddProv = v => { state.addProv=v.toUpperCase(); render(); };
window.addItem = async () => {
  const prov=(state.newItem.proveedor==="__nuevo__"?state.addProv:state.newItem.proveedor).toUpperCase();
  if (!prov||!state.newItem.nombre.trim()) return;
  const cat=[...state.catalogo];
  const idx=cat.findIndex(g=>g.proveedor===prov);
  const item={nombre:state.newItem.nombre.trim(),min:parseFloat(state.newItem.min)||0};
  if (idx>=0) cat[idx]={...cat[idx],items:[...cat[idx].items,item]};
  else cat.push({proveedor:prov,items:[item]});
  state.catalogo=cat; state.newItem={proveedor:"",nombre:"",min:""}; state.addProv="";
  await saveCatalogo(); render();
};
window.delItem = async (pe,ne) => {
  const p=decodeURIComponent(pe),n=decodeURIComponent(ne);
  state.catalogo=state.catalogo.map(g=>g.proveedor!==p?g:{...g,items:g.items.filter(i=>i.nombre!==n)}).filter(g=>g.items.length>0);
  await saveCatalogo(); render();
};
window.openEdit = (pe,ne,min) => { state.editModal={proveedor:decodeURIComponent(pe),original:decodeURIComponent(ne),nombre:decodeURIComponent(ne),min}; render(); };
window.closeEdit = () => { state.editModal=null; render(); };
window.emChange = (f,v) => { state.editModal={...state.editModal,[f]:v}; };
window.saveEdit = async () => {
  const {proveedor,original,nombre,min}=state.editModal;
  state.catalogo=state.catalogo.map(g=>g.proveedor!==proveedor?g:{...g,items:g.items.map(i=>i.nombre===original?{nombre,min:parseFloat(min)||0}:i)});
  state.editModal=null; await saveCatalogo(); render();
};

loadData();
</script>
</body>
</html>
