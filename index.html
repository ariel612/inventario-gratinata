<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Gratinata"/>
<title>Inventario - Gratinata Pizza</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a;padding-bottom:90px}
.header{background:#fff;padding:14px 16px 10px;border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:10}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fecha{font-size:12px;color:#888;text-transform:capitalize}
.save-msg{font-size:12px;color:#22c55e;min-width:80px;text-align:right}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:8px 0;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:14px;cursor:pointer;color:#666}
.tab.active{border:1.5px solid #3b82f6;background:#eff6ff;color:#1d4ed8;font-weight:500}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.progress-bar{height:5px;background:#e5e5e5;border-radius:99px}
.progress-fill{height:5px;background:#3b82f6;border-radius:99px;transition:width .3s}
.section{padding:0 16px}
.proveedor-label{font-size:11px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;margin:10px 0 4px;border-radius:6px;background:#3b82f6;display:inline-block}
.item-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f0f0f0}
.item-info{flex:1;min-width:0}
.item-nombre{font-size:13px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-nombre.procesado{color:#aaa}
.item-min{font-size:11px;color:#888}
.item-min.bajo{color:#ef4444}
.checkbox{width:20px;height:20px;border-radius:4px;border:1px solid #ccc;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff}
.checkbox.checked{border-color:#22c55e;background:#f0fdf4}
.checkbox.checked::after{content:'OK';font-size:10px;color:#22c55e}
.inp-stock{width:56px;text-align:center;font-size:14px;padding:5px 4px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a}
.inp-stock.bajo{border-color:#ef4444}
.inp-ped{width:52px;text-align:center;font-size:14px;padding:5px 4px;border-radius:8px;border:1px solid #f59e0b;background:#fffbeb;color:#1a1a1a}
.diff{font-size:11px;flex-shrink:0}
.diff.up{color:#22c55e}
.diff.down{color:#ef4444}
.admin-panel{padding:0 16px 12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.summary-card{background:#fff;border-radius:10px;padding:12px}
.summary-card .label{font-size:12px;color:#888;margin-bottom:4px}
.summary-card .value{font-size:22px;font-weight:600}
.value.danger{color:#ef4444}
.value.ok{color:#22c55e}
.alert-box{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.alert-title{font-size:13px;font-weight:600;color:#dc2626;margin-bottom:6px}
.alert-item{font-size:12px;color:#dc2626;padding:2px 0}
.admin-tabs{display:flex;gap:6px;margin-bottom:10px}
.admin-tab{flex:1;padding:6px 0;font-size:13px;border-radius:8px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666}
.admin-tab.active{border:1.5px solid #3b82f6;background:#eff6ff;color:#1d4ed8;font-weight:500}
.add-form{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px}
.field{margin-bottom:8px}
.field label{font-size:12px;color:#888;display:block;margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;font-size:14px;background:#fff;color:#1a1a1a}
.btn{width:100%;padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;border:none;margin-top:4px}
.btn-primary{background:#3b82f6;color:#fff;font-weight:500}
.btn-secondary{background:#fff;color:#444;border:1px solid #ddd}
.edit-btns{display:flex;gap:6px;flex-shrink:0}
.btn-edit{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333;cursor:pointer}
.btn-del{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;cursor:pointer}
.footer{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:#fff;border-top:1px solid #e5e5e5}
.footer-inner{max-width:480px;margin:0 auto;display:flex;gap:6px;align-items:center}
.footer-count{flex:1;font-size:12px;color:#888}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px}
.modal-btns{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:200px;color:#888;font-size:14px">Cargando inventario...</div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyB9reUnHGDLL2PQeZ2fzU2MmDSZzcKi-as",authDomain:"inventario-gratinata.firebaseapp.com",projectId:"inventario-gratinata",storageBucket:"inventario-gratinata.firebasestorage.app",messagingSenderId:"191809403412",appId:"1:191809403412:web:d024e41463066bbdf58501"});
const db=firebase.firestore();
const INV=[{proveedor:"CAVELI",items:[{nombre:"Alcohol caja 20 lt",min:1},{nombre:"Alusa",min:1},{nombre:"Queso cabra Holandia despunte kg",min:8},{nombre:"Mantequilla Kumet caja",min:1},{nombre:"Pieza jamon art. Victoria 2,5 kg",min:4},{nombre:"Cheddar laminado 2,7 kg",min:1},{nombre:"Rueda parmesano",min:1},{nombre:"Rueda queso azul Santa Rosa",min:1},{nombre:"Salsa soya",min:1},{nombre:"Salsa cheddar Santa Rosa kg",min:5},{nombre:"Longaniza kg",min:3},{nombre:"Fondo alcachofa caja 10 uni",min:1},{nombre:"Toalla papel pqte 16",min:1},{nombre:"Lavaloza lt",min:2},{nombre:"Frambuesa kg",min:7},{nombre:"Mango kg",min:7},{nombre:"Pina kg",min:7},{nombre:"Frutillas kg",min:7}]},{proveedor:"BIDFOOD",items:[{nombre:"Popcorn pollo kg",min:8},{nombre:"Pepinillo laminado kg",min:2},{nombre:"Mostaza Heinz kg",min:2},{nombre:"Tocino laminado ahumado kg",min:18},{nombre:"Mayonesa Kraft Real Mayo 3,7 kg",min:4},{nombre:"Sal kg",min:10},{nombre:"Aceite oliva Dido 5 lt",min:2},{nombre:"Mechada caja 8 kg",min:3},{nombre:"Traperos desechables",min:8},{nombre:"Papas Simplot 7mm caja 8 bolsas",min:32},{nombre:"Choclo 500 gr",min:5}]},{proveedor:"ICB",items:[{nombre:"Pepperoni Sugardele caja 6 kg",min:1},{nombre:"Aceitunas 10 kg",min:1},{nombre:"Aros cebolla 6 uni",min:3},{nombre:"BBQ 10 kg",min:1},{nombre:"Semola kg",min:12},{nombre:"Pina rodaja tarro 3 kg",min:1},{nombre:"Cereal Kellogs cj 8 uni",min:1},{nombre:"Guantes nitrilo M y S",min:2},{nombre:"Hamburguesa Angus 198gr cj 24 uni",min:5},{nombre:"Ajo en polvo kg",min:1}]},{proveedor:"GLOBEITALIA",items:[{nombre:"Tarro tomate Divella 4,05 kg",min:21}]},{proveedor:"GAG",items:[{nombre:"Camaron 36/40 crudo c/cascara kg",min:10}]},{proveedor:"LENA",items:[{nombre:"Sacos",min:25}]},{proveedor:"QUIYALLES",items:[{nombre:"Leche entera",min:24},{nombre:"Leche entera sin lactosa",min:12}]},{proveedor:"ERICK PALTAS",items:[{nombre:"Paltas kg",min:20}]},{proveedor:"OLIVO",items:[{nombre:"Bombillas negras 25x200",min:0.1},{nombre:"Esponja lavaloza",min:4},{nombre:"Rollo bolsa prepicada 30x40/20x30",min:1},{nombre:"Pano pack 3",min:2},{nombre:"Rollo termico 10 uni",min:0.5},{nombre:"Pqte servilletas negras 1200 uni",min:1},{nombre:"Harina estampa pizza 20 kg",min:6},{nombre:"Virutilla gruesa olla",min:4},{nombre:"Aceite freir Frito Rico",min:3},{nombre:"Papas Simplot 7mm 8 uni x caja",min:4},{nombre:"Bolsa basura 70x90 10 uni",min:5},{nombre:"Guante nitrilo M",min:1},{nombre:"Guante nitrilo S",min:1},{nombre:"Jabon 5 lt",min:1},{nombre:"Papel interfoleado 15 uni",min:1}]},{proveedor:"SUPERMERCADO",items:[{nombre:"Bolsa basura chica bano",min:2},{nombre:"Cloro gel",min:2},{nombre:"Confort 9 uni x 50 mt",min:0},{nombre:"Huevos bandeja 30 uni",min:1},{nombre:"Levadura",min:1},{nombre:"Bolsas palillos hamburguesa",min:120},{nombre:"Fosforos",min:1},{nombre:"Virutilla piso",min:2},{nombre:"Azucar kg",min:10},{nombre:"Nuez moscada",min:2},{nombre:"Paprika",min:1},{nombre:"Vinagre bidon 5 lts",min:1},{nombre:"Shitake bolsa estandar",min:2},{nombre:"Champinones 200 grs",min:15},{nombre:"Mangas XL chinos 1 pqte",min:1},{nombre:"Bolsas vacio 25x35 ML 1 pqte",min:1},{nombre:"Marshmallow bolsa",min:2},{nombre:"Hielo 2,5",min:10}]},{proveedor:"TRES ARAUCO",items:[{nombre:"Mozzarella Molfino caja 6 uni",min:4}]},{proveedor:"PUKARA",items:[{nombre:"Pan papa 12 cm sesamo blanco 36 uni",min:3}]}];
const wk=()=>{const d=new Date(),w=Math.ceil(d.getDate()/7);return d.getFullYear()+"-"+(d.getMonth()+1)+"-w"+w;};
const pwk=()=>{const d=new Date();d.setDate(d.getDate()-7);const w=Math.ceil(d.getDate()/7);return d.getFullYear()+"-"+(d.getMonth()+1)+"-w"+w;};
const bk=(p,n)=>p+"||"+n;
let S={mode:"cocina",tab:"ver",stock:{},prev:{},cat:INV,msg:"",modal:null,ni:{p:"",n:"",m:""},ap:""};
let st=null;
async function load(){
  try{
    const c=await db.collection("gratinata").doc("catalogo").get();
    if(c.exists)S.cat=c.data().items||INV;
    const s=await db.collection("stock").doc(wk()).get();
    if(s.exists)S.stock=s.data().entries||{};
    const p=await db.collection("stock").doc(pwk()).get();
    if(p.exists)S.prev=p.data().entries||{};
  }catch(e){console.error(e);}
  render();
  db.collection("stock").doc(wk()).onSnapshot(s=>{if(s.exists){S.stock=s.data().entries||{};render();}});
}
async function save(){
  clearTimeout(st);
  st=setTimeout(async()=>{
    try{
      await db.collection("stock").doc(wk()).set({entries:S.stock,updatedAt:new Date().toISOString()});
      S.msg="Guardado";render();setTimeout(()=>{S.msg="";render();},2000);
    }catch(e){S.msg="Error";render();}
  },600);
}
async function saveCat(){await db.collection("gratinata").doc("catalogo").set({items:S.cat});}
function gv(p,n,f,fb){fb=fb===undefined?"":fb;var k=bk(p,n);return(S.stock[k]&&S.stock[k][f]!==undefined)?S.stock[k][f]:fb;}
function gp(p,n){var k=bk(p,n);return(S.prev[k]&&S.prev[k].stock!==undefined)?S.prev[k].stock:null;}
function upd(p,n,f,v){var k=bk(p,n);S.stock=Object.assign({},S.stock);S.stock[k]=Object.assign({},S.stock[k]||{});S.stock[k][f]=v;S.msg="Guardando...";render();save();}
function tot(){return S.cat.reduce(function(a,g){return a+g.items.length;},0);}
function fil(){return S.cat.reduce(function(a,g){return a+g.items.filter(function(i){return gv(g.proveedor,i.nombre,"stock")!=="";}).length;},0);}
function low(){return S.cat.reduce(function(a,g){return a.concat(g.items.filter(function(i){var s=parseFloat(gv(g.proveedor,i.nombre,"stock",""));return !isNaN(s)&&i.min>0&&s<i.min;}).map(function(i){return Object.assign({},i,{proveedor:g.proveedor});}));},[]); }
function wl(){return new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});}
function render(){
  var t=tot(),f=fil(),lw=low(),pct=t>0?Math.round(f/t*100):0;
  var m=S.mode,tab=S.tab;
  var h='<div class="header"><div class="header-top"><div><div style="font-size:17px;font-weight:600">Gratinata Pizza</div><div class="fecha">'+wl()+'</div></div><div class="save-msg">'+S.msg+'</div></div>';
  h+='<div class="tabs"><button class="tab'+(m==="cocina"?" active":"")+'" onclick="setM('cocina')">Modo cocina</button><button class="tab'+(m==="administrador"?" active":"")+'" onclick="setM('administrador')">Modo administrador</button></div>';
  h+='<div class="progress-label"><span>Progreso</span><span>'+f+'/'+t+'</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';
  if(m==="administrador"){
    h+='<div class="admin-panel"><div class="summary-grid"><div class="summary-card"><div class="label">Bajo minimo</div><div class="value '+(lw.length>0?"danger":"ok")+'">'+lw.length+'</div></div><div class="summary-card"><div class="label">Completado</div><div class="value">'+pct+'%</div></div></div>';
    if(lw.length>0){h+='<div class="alert-box"><div class="alert-title">Bajo minimo</div>';lw.forEach(function(i){h+='<div class="alert-item">'+i.nombre+' stock:'+gv(i.proveedor,i.nombre,"stock")+'/min:'+i.min+' ('+i.proveedor+')</div>';});h+='</div>';}
    h+='<div class="admin-tabs"><button class="admin-tab'+(tab==="ver"?" active":"")+'" onclick="setT('ver')">Ver</button><button class="admin-tab'+(tab==="editar"?" active":"")+'" onclick="setT('editar')">Editar</button><button class="admin-tab'+(tab==="agregar"?" active":"")+'" onclick="setT('agregar')">Agregar</button></div>';
    if(tab==="agregar"){
      h+='<div class="add-form"><div class="field"><label>Proveedor</label><select onchange="niP(this.value)"><option value="">Seleccionar</option>'+S.cat.map(function(g){return '<option value="'+g.proveedor+'">'+g.proveedor+'</option>';}).join('')+'<option value="__nuevo__">+ Nuevo</option></select></div>';
      if(S.ni.p==="__nuevo__")h+='<div class="field"><label>Nuevo proveedor</label><input value="'+S.ap+'" oninput="setAP(this.value)"/></div>';
      h+='<div class="field"><label>Nombre producto</label><input value="'+S.ni.n+'" oninput="niN(this.value)"/></div><div class="field"><label>Minimo</label><input type="number" min="0" step="0.5" value="'+S.ni.m+'" oninput="niM(this.value)"/></div><button class="btn btn-primary" onclick="addI()">+ Agregar</button></div>';
    }
    h+='</div>';
  }
  if(m==="cocina"||(m==="administrador"&&(tab==="ver"||tab==="editar"))){
    h+='<div class="section">';
    S.cat.forEach(function(g){
      h+='<div class="proveedor-label">'+g.proveedor+'</div>';
      g.items.forEach(function(item){
        var p=g.proveedor,sk=gv(p,item.nombre,"stock",""),pr=gv(p,item.nombre,"procesado",false);
        var sn=parseFloat(sk),bajo=(!isNaN(sn)&&item.min>0&&sn<item.min);
        var pv=gp(p,item.nombre),df=(pv!==null&&sk!=="")?(sn-parseFloat(pv)):null;
        var pe=encodeURIComponent(p),ne=encodeURIComponent(item.nombre);
        var ped=gv(p,item.nombre,"pedido","");
        h+='<div class="item-row">';
        if(m==="cocina")h+='<div class="checkbox'+(pr?" checked":"")+'" onclick="tog(''+pe+'',''+ne+'')"></div>';
        h+='<div class="item-info"><div class="item-nombre'+(pr&&m==="cocina"?" procesado":"")+'">'+item.nombre+'</div>';
        if(item.min>0)h+='<div class="item-min'+(bajo?" bajo":"")+'">min:'+item.min+(bajo?" BAJO":"")+' </div>';
        h+='</div>';
        if(m==="administrador"&&tab==="ver"&&df!==null)h+='<span class="diff '+(df>=0?"up":"down")+'">'+(df>=0?"+":"")+df.toFixed(1)+'</span>';
        if(m==="administrador"&&tab==="editar"){
          h+='<div class="edit-btns"><button class="btn-edit" onclick="opE(''+pe+'',''+ne+'','+item.min+')">Editar</button><button class="btn-del" onclick="delI(''+pe+'',''+ne+'')">Eliminar</button></div>';
        } else {
          h+='<input type="number" min="0" step="0.1" class="inp-stock'+(bajo?" bajo":"")+'" value="'+sk+'" placeholder="0" oninput="upS(''+pe+'',''+ne+'',this.value)"/>';
          if(m==="administrador"&&tab==="ver")h+='<input type="number" min="0" step="1" class="inp-ped" placeholder="ped" value="'+ped+'" oninput="upP(''+pe+'',''+ne+'',this.value)"/>';
        }
        h+='</div>';
      });
    });
    h+='</div>';
  }
  if(m==="cocina")h+='<div class="footer"><div class="footer-inner"><div class="footer-count">'+f+'/'+t+' completados</div><button class="btn btn-secondary" style="width:auto;padding:8px 14px" onclick="markAll()">Todos procesados</button></div></div>';
  if(m==="administrador"&&tab==="ver")h+='<div class="footer"><div class="footer-inner"><button class="btn btn-secondary" style="flex:1;font-size:12px" onclick="dlInv()">Inventario</button><button class="btn btn-primary" style="flex:1;font-size:12px" onclick="dlPed()">Pedido</button></div></div>';
  if(S.modal)h+='<div class="modal-overlay"><div class="modal"><div class="modal-title">Editar producto</div><div class="field"><label>Nombre</label><input value="'+S.modal.nombre+'" oninput="emN(this.value)"/></div><div class="field"><label>Minimo</label><input type="number" min="0" step="0.5" value="'+S.modal.min+'" oninput="emM(this.value)"/></div><div class="modal-btns"><button class="btn btn-secondary" onclick="clE()">Cancelar</button><button class="btn btn-primary" onclick="svE()">Guardar</button></div></div></div>';
  document.getElementById("app").innerHTML=h;
}
window.setM=function(v){S.mode=v;S.tab="ver";render();};
window.setT=function(v){S.tab=v;render();};
window.upS=function(pe,ne,v){upd(decodeURIComponent(pe),decodeURIComponent(ne),"stock",v);};
window.upP=function(pe,ne,v){upd(decodeURIComponent(pe),decodeURIComponent(ne),"pedido",v);};
window.tog=function(pe,ne){var p=decodeURIComponent(pe),n=decodeURIComponent(ne);upd(p,n,"procesado",!gv(p,n,"procesado",false));};
window.markAll=function(){S.cat.forEach(function(g){g.items.forEach(function(i){upd(g.proveedor,i.nombre,"procesado",true);});});};
window.niP=function(v){S.ni.p=v;render();};
window.niN=function(v){S.ni.n=v;};
window.niM=function(v){S.ni.m=v;};
window.setAP=function(v){S.ap=v.toUpperCase();};
window.addI=async function(){
  var prov=(S.ni.p==="__nuevo__"?S.ap:S.ni.p).toUpperCase();
  if(!prov||!S.ni.n.trim())return;
  var cat=S.cat.slice(),idx=cat.findIndex(function(g){return g.proveedor===prov;});
  var item={nombre:S.ni.n.trim(),min:parseFloat(S.ni.m)||0};
  if(idx>=0)cat[idx]=Object.assign({},cat[idx],{items:cat[idx].items.concat([item])});
  else cat.push({proveedor:prov,items:[item]});
  S.cat=cat;S.ni={p:"",n:"",m:""};S.ap="";
  await saveCat();render();
};
window.delI=async function(pe,ne){
  var p=decodeURIComponent(pe),n=decodeURIComponent(ne);
  S.cat=S.cat.map(function(g){return g.proveedor!==p?g:Object.assign({},g,{items:g.items.filter(function(i){return i.nombre!==n;});});}).filter(function(g){return g.items.length>0;});
  await saveCat();render();
};
window.opE=function(pe,ne,min){S.modal={proveedor:decodeURIComponent(pe),original:decodeURIComponent(ne),nombre:decodeURIComponent(ne),min:min};render();};
window.clE=function(){S.modal=null;render();};
window.emN=function(v){if(S.modal)S.modal.nombre=v;};
window.emM=function(v){if(S.modal)S.modal.min=v;};
window.svE=async function(){
  var pr=S.modal.proveedor,or=S.modal.original,nb=S.modal.nombre,mn=S.modal.min;
  S.cat=S.cat.map(function(g){return g.proveedor!==pr?g:Object.assign({},g,{items:g.items.map(function(i){return i.nombre===or?{nombre:nb,min:parseFloat(mn)||0}:i;});});});
  S.modal=null;await saveCat();render();
};
window.dlInv=function(){
  var lines=["Inventario - Gratinata Pizza","Semana: "+new Date().toLocaleDateString("es-CL"),""];
  S.cat.forEach(function(g){lines.push("== "+g.proveedor+" ==");g.items.forEach(function(i){lines.push("["+(gv(g.proveedor,i.nombre,"procesado",false)?"OK":" ")+"] "+i.nombre+" | Stock: "+(gv(g.proveedor,i.nombre,"stock")||"-")+" | Min: "+i.min);});lines.push("");});
  var b=new Blob([lines.join("\n")],{type:"text/plain"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="inventario_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(u);
};
window.dlPed=function(){
  var lines=[];
  S.cat.forEach(function(g){
    var its=g.items.filter(function(i){return gv(g.proveedor,i.nombre,"pedido","")!=="";});
    if(its.length===0)return;
    lines.push(g.proveedor);
    its.forEach(function(i){lines.push("* "+i.nombre+" "+gv(g.proveedor,i.nombre,"pedido",""));});
    lines.push("");
  });
  if(lines.length===0){alert("No hay pedidos ingresados");return;}
  var b=new Blob([lines.join("\n")],{type:"text/plain"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="pedido_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(u);
};
load();
</script>
