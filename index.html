<style>
:root{
  --ink:#18140f;
  --ink-2:#251f17;
  --gold:#c99a2e;
  --gold-dk:#a87d1f;
  --gold-soft:#f2e3bb;
  --cream:#f6f1e7;
  --paper:#fffdf9;
  --line:#e8e0d1;
  --text:#221d15;
  --sub:#8a7f6c;
  --ok:#3f7d4f;
  --ok-soft:#e8f3ea;
  --danger:#b3402c;
  --danger-soft:#fbe9e4;
  --warn:#b9822f;
  --warn-soft:#faf0dd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--cream);color:var(--text);padding-bottom:140px;-webkit-font-smoothing:antialiased}
.hdr{background:var(--ink);padding:calc(16px + env(safe-area-inset-top)) 16px 12px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand-logo{height:34px;width:auto;display:block}
.fecha{font-size:11.5px;color:var(--gold-soft);text-transform:capitalize;letter-spacing:.02em;margin-top:2px}
.smsg{font-size:11px;color:var(--gold);min-width:76px;text-align:right;letter-spacing:.02em}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--ink-2);border-radius:11px;padding:3px}
.tab{flex:1;padding:8px 0;border-radius:9px;border:none;background:transparent;font-family:'Inter';font-size:13px;font-weight:500;cursor:pointer;color:#c9bfa9}
.tab.active{background:var(--gold);color:var(--ink)}
.pb-lbl{display:flex;justify-content:space-between;font-size:11px;color:#a89b7f;margin-bottom:5px;letter-spacing:.02em}
.pb{height:4px;background:#3a3226;border-radius:99px}
.pbf{height:4px;background:var(--gold);border-radius:99px;transition:width .3s}
.sec{padding:12px 16px 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.sb-wrap{padding:12px 16px 0}
.sb{width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:'Inter';background:var(--paper);color:var(--text)}
.sb:focus{outline:none;border-color:var(--gold)}
body.dark .sb{background:#241f18;border-color:#3a3226;color:#f0e9da}
.nores{padding:24px 0;text-align:center;color:var(--sub);font-size:13px;grid-column:1/-1}
.prov-grp{border-radius:12px;overflow:hidden;background:var(--ink);align-self:start}
.prov-grp.open{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.prov{font-family:'Fraunces',serif;font-size:12.5px;font-weight:600;color:#fbf6ea;text-transform:uppercase;letter-spacing:.05em;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:6px}
.prov-grp.open .prov{color:var(--ink);border-bottom:1px dashed var(--line)}
.prov-name{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.prov-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0}
.prov-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prov-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.prov-ct{font-family:'Inter';font-size:10px;font-weight:600;opacity:.8}
.prov-chev{transition:transform .2s;font-size:9px;opacity:.75}
.prov-chev.open{transform:rotate(90deg)}
.prov-items{padding:2px 4px;animation:fadein .15s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.row{display:flex;align-items:center;gap:8px;padding:9px 8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.info{flex:1;min-width:0}
.nom{font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.nom.proc{color:#b8ae9a;text-decoration:line-through}
.mn{font-size:11px;color:var(--sub);margin-top:1px}
.mn.bajo{color:var(--danger);font-weight:600}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid #d8cfba;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.chk.on{border-color:var(--ok);background:var(--ok)}
.chk.on::after{content:'¹3';font-size:12px;color:#fff;font-weight:700}
.is{width:58px;text-align:center;font-size:14px;padding:6px 4px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--text);font-family:'Inter'}
.is:focus{outline:none;border-color:var(--gold)}
.is.bajo{border-color:var(--danger);background:var(--danger-soft)}
.ip{width:50px;text-align:center;font-size:14px;padding:6px 4px;border-radius:9px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--text);font-family:'Inter'}
.df{font-size:10.5px;flex-shrink:0;font-weight:600}
.df.up{color:var(--ok)}
.df.dn{color:var(--danger)}
.ap{padding:0 16px 12px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px}
.sc .lbl{font-size:11px;color:var(--sub);margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.sc .val{font-family:'Fraunces',serif;font-size:24px;font-weight:600}
.val.dng{color:var(--danger)}
.val.ok{color:var(--ok)}
.ab{background:var(--danger-soft);border:1px solid #e6c1b6;border-radius:12px;padding:11px 13px;margin-bottom:12px}
.at{font-size:12.5px;font-weight:700;color:var(--danger);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.ai{font-size:12.5px;color:#7a2c1c;padding:2px 0}
.atbs{display:flex;gap:6px;margin-bottom:12px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px}
.atb{flex:1;padding:7px 0;font-size:12.5px;font-weight:500;border-radius:8px;cursor:pointer;border:none;background:transparent;color:var(--sub);font-family:'Inter'}
.atb.active{background:var(--ink);color:var(--gold-soft);font-weight:600}
.af{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.fld{margin-bottom:10px}
.fld label{font-size:11px;color:var(--sub);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
.fld input,.fld select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:14px;background:var(--paper);color:var(--text);font-family:'Inter'}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;padding:11px 0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;margin-top:4px;font-family:'Inter'}
.btnp{background:var(--gold);color:var(--ink)}
.btns{background:var(--paper);color:var(--text);border:1px solid var(--line)}
.btnr{background:var(--paper);color:var(--danger);border:1px solid #e6c1b6}
.ebs{display:flex;gap:6px;flex-shrink:0}
.be{font-size:12px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;font-family:'Inter';font-weight:500}
.bd{font-size:12px;padding:6px 11px;border-radius:8px;border:1px solid #e6c1b6;background:var(--danger-soft);color:var(--danger);cursor:pointer;font-family:'Inter';font-weight:500}
.ftr{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--ink);border-top:2px solid var(--gold)}
.ftri{max-width:480px;margin:0 auto;display:flex;gap:6px;align-items:center}
.ftrc{flex:1;font-size:11.5px;color:var(--gold-soft)}
.mo{position:fixed;inset:0;background:rgba(20,16,10,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--paper);border-radius:16px;padding:20px;width:100%;max-width:380px;border-top:4px solid var(--gold)}
.mt{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:14px}
.mbs{display:flex;gap:8px;margin-top:12px}

body.dark{--cream:#161310;--paper:#221d17;--line:#3a3226;--text:#f1e9d9;--sub:#a89b83;background:var(--cream);color:var(--text)}
body.dark .prov-grp{background:var(--ink-2)}
body.dark .prov-grp.open{background:var(--paper);border-color:var(--line)}
body.dark .row{border-bottom-color:var(--line)}
body.dark .is{background:#2a241c;border-color:var(--line);color:var(--text)}
body.dark .ip{background:#3a2c12;border-color:var(--warn);color:var(--text)}
body.dark .sc{background:var(--paper);border-color:var(--line)}
body.dark .ab{background:#3a1d16;border-color:#5c2c1f}
body.dark .ai{color:#f0b09e}
body.dark .af{background:var(--paper);border-color:var(--line)}
body.dark .fld input,body.dark .fld select{background:#2a241c;border-color:var(--line);color:var(--text)}
body.dark .btns{background:#2a241c;color:var(--text);border-color:var(--line)}
body.dark .md{background:var(--paper)}
body.dark .ftr{background:var(--ink)}
body.dark .nom.proc{color:#7d7263}
body.dark .atbs{background:var(--paper);border-color:var(--line)}
body.dark .be{background:#2a241c;border-color:var(--line);color:var(--text)}
body.dark .chk{background:#2a241c;border-color:#4a4234}
.dark-toggle{cursor:pointer;font-size:18px;padding:4px 7px;border-radius:8px;border:none;background:rgba(255,255,255,.08);color:var(--gold-soft)}

/* --- Steppers de conteo rapido --- */
.stp{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stp-b{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--text);font-size:16px;font-weight:600;font-family:'Inter';cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.stp-b:active{transform:scale(.9);background:var(--gold-soft);border-color:var(--gold)}
.stp-b.wide{width:40px;font-size:12px}
body.dark .stp-b{background:#2a241c;border-color:var(--line);color:var(--text)}

/* --- Estado visual de fila --- */
.row.ok .nom{color:var(--ok)}
.row.low{background:var(--danger-soft);border-radius:8px}
body.dark .row.low{background:#3a1d16}

/* --- Chip de proveedor: anillo, alerta, completado --- */
.prov-ring{height:3px;background:rgba(255,255,255,.16);border-radius:99px;margin:0 12px 9px}
.prov-grp.open .prov-ring{background:var(--line);margin-bottom:0}
.prov-ring-f{height:3px;background:var(--gold);border-radius:99px;transition:width .25s}
.prov-dot{display:none}
.prov-grp.haslow .prov-dot{display:block}
.prov-check{display:none;color:var(--ok);font-weight:700}
.prov-grp.done .prov-check{display:inline}
.prov-grp.done{background:var(--ok-soft);border:1px solid #cbe3d1}
.prov-grp.done .prov{color:var(--ok)}
.prov-grp.done .prov-ring-f{background:var(--ok)}
.prov-grp.done .prov-ct{opacity:.55}
body.dark .prov-grp.done{background:#1d3024;border-color:#2f4a37}
body.dark .prov-grp.done .prov{color:#7fc496}

/* --- Aviso de logro --- */
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--gold-soft);font-family:'Fraunces',serif;font-size:14px;font-weight:600;padding:11px 20px;border-radius:99px;z-index:200;border:1px solid var(--gold);animation:pop .3s ease;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.toast.out{opacity:0;transition:opacity .3s}

/* --- Confeti final --- */
#cf{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.cfp{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(600deg);opacity:.9}}

/* --- Boton siguiente pendiente --- */
.fab{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px 0;border-radius:11px;border:none;background:var(--gold);color:var(--ink);font-family:'Inter';font-size:13.5px;font-weight:700;cursor:pointer;letter-spacing:.01em}
.fab.done{background:var(--ok);color:#fff}
.prog-msg{font-family:'Fraunces',serif;font-size:12px;color:var(--gold);letter-spacing:.01em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Contado pero con faltantes: gana el aviso, no el "listo" */
.prov-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;box-shadow:0 0 0 2px rgba(179,64,44,.22)}
.prov-grp.done.haslow{background:var(--danger-soft);border:1px solid #e6c1b6}
.prov-grp.done.haslow .prov{color:var(--danger)}
.prov-grp.done.haslow .prov-ring-f,.prov-grp.haslow .prov-ring-f{background:var(--danger)}
.prov-grp.done.haslow .prov-check{color:var(--danger)}
body.dark .prov-grp.done.haslow{background:#3a1d16;border-color:#5c2c1f}
body.dark .prov-grp.done.haslow .prov{color:#f0a794}
</style>
</head>

  var wasP=provDone(p), wasAll=(tot()>0&&fil()===tot());
  var k=bk(p,n);S.sk=Object.assign({},S.sk);S.sk[k]=Object.assign({},S.sk[k]||{});S.sk[k]["stock"]=v;
  var row=document.querySelector('[data-p="'+p+'"][data-n="'+n+'"]');
  var grp=S.cat.find(function(g){return g.p===p;});
  var item=grp&&grp.i.find(function(i){return i.n===n;});
  var sn=parseFloat(v);
  var bajo=!!(item&&!isNaN(sn)&&item.m>0&&sn<item.m);
  if(row){
    var inp=row.querySelector("[data-action=stock]");
    if(inp)inp.className="is"+(bajo?" bajo":"");
    var mn=row.querySelector(".mn");
    if(mn){mn.className="mn"+(bajo?" bajo":"");mn.textContent="min:"+(item?item.m:"")+(bajo?" BAJO":"");}
    row.classList.toggle("low",bajo);
    row.classList.toggle("ok",!bajo&&v!=="");
  }
  refreshChip(p);refreshProgress();
  if(!wasP&&provDone(p)&&fil()!==tot()){buzz([14,60,14]);toast(p+" listo");}
  if(!wasAll&&tot()>0&&fil()===tot()){buzz([20,80,20,80,20]);confetti();toast("\u00a1Inventario completo!");}
  saveS();
}
function tot(){return S.cat.reduce(function(a,g){return a+g.i.length;},0);}
function fil(){return S.cat.reduce(function(a,g){return a+g.i.filter(function(i){return gv(g.p,i.n,"stock")!=="";}).length;},0);}
function low(){return S.cat.reduce(function(a,g){return a.concat(g.i.filter(function(i){var s=parseFloat(gv(g.p,i.n,"stock",""));return !isNaN(s)&&i.m>0&&s<i.m;}).map(function(i){return {n:i.n,m:i.m,p:g.p};}));},[]); }
function wl(){return new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});}
// --- Paso proporcional al tamano del item ---
function stepOf(m){if(m>=50)return 10;if(m>=20)return 5;return 1;}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms||12);}catch(e){}}
function provDone(p){var g=S.cat.find(function(x){return x.p===p;});if(!g)return false;return g.i.every(function(i){return gv(p,i.n,"stock","")!=="";});}
function toast(txt){
  var old=document.querySelector(".toast");if(old)old.remove();
  var el=document.createElement("div");el.className="toast";el.textContent=txt;
  document.body.appendChild(el);
  setTimeout(function(){el.classList.add("out");setTimeout(function(){el.remove();},320);},1900);
}
function confetti(){
  var old=document.getElementById("cf");if(old)old.remove();
  var wrap=document.createElement("div");wrap.id="cf";
  var cols=["#c99a2e","#f2e3bb","#3f7d4f","#fffdf9"];
  for(var i=0;i<44;i++){
    var p=document.createElement("div");p.className="cfp";
    p.style.left=(Math.random()*100)+"%";
    p.style.background=cols[i%cols.length];

// --- Refresca el chip de un proveedor sin re-renderizar todo ---

  var hd=document.querySelector('[data-prov="'+p+'"]');if(!hd)return;
  var grp=hd.closest(".prov-grp");

  var low=g.i.some(function(i){var s=parseFloat(gv(p,i.n,"stock",""));return !isNaN(s)&&i.m>0&&s<i.m;});
  var ct=hd.querySelector(".prov-ct");if(ct)ct.textContent=done+"/"+g.i.length;
  var rf=grp&&grp.querySelector(".prov-ring-f");if(rf)rf.style.width=(g.i.length?Math.round(done/g.i.length*100):0)+"%";
  if(grp){grp.classList.toggle("done",done===g.i.length);grp.classList.toggle("haslow",low);}

function refreshProgress(){
  var f=fil(),t=tot(),pct=t>0?Math.round(f/t*100):0;

  var lbl=document.querySelector(".pb-lbl");if(lbl)lbl.innerHTML='<span class="prog-msg">'+progMsg(pct)+'</span><span>'+f+'/'+t+'</span>';

function progMsg(pct){
  if(pct===0)return "Partamos";
  if(pct<30)return "Vamos avanzando";
  if(pct<60)return "Mitad de camino";
  if(pct<90)return "Ya casi";
  if(pct<100)return "Ultimo tiron";
  return "Inventario completo";

function nextPend(){

// --- Marcar procesado con respuesta inmediata ---
function togProc(p,n){
  var v=!gv(p,n,"procesado",false);

// --- Suma/resta rapida con celebracion ---
function bump(p,n,d,m){
  var cur=parseFloat(gv(p,n,"stock",""));
  if(isNaN(cur))cur=0;
  var nv=Math.round((cur+d)*100)/100;
  if(nv<0)nv=0;
  updStock(p,n,String(nv));
  var row=document.querySelector('[data-p="'+p+'"][data-n="'+n+'"]');
  if(row){var inp=row.querySelector("[data-action=stock]");if(inp)inp.value=nv;}
  buzz(10);
}

function dlInv(){
  var lines=["Inventario - Gratinata Pizza","Semana: "+new Date().toLocaleDateString("es-CL"),""];
  S.cat.forEach(function(g){lines.push("== "+g.p+" ==");g.i.forEach(function(i){lines.push("["+(gv(g.p,i.n,"procesado",false)?"OK":" ")+"] "+i.n+" | Stock: "+(gv(g.p,i.n,"stock")||"-")+" | Min: "+i.m);});lines.push("");});
  var b=new Blob([lines.join("\n")],{type:"text/plain"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="inventario_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(u);
}
function savePedido(){
  var items=[];
  S.cat.forEach(function(g){
    g.i.forEach(function(i){
      var v=gv(g.p,i.n,"pedido","");
      if(v!=="")items.push({p:g.p,n:i.n,c:v});
    });
  });
  if(items.length===0)return;
  var key="pedido_"+new Date().toISOString().slice(0,10)+"_"+Date.now();
  var pedido={fecha:new Date().toLocaleDateString("es-CL"),items:items};
  db.collection("pedidos").doc(key).set(pedido).then(function(){
    limpiarPedidosAntiguos();
  });
}
function limpiarPedidosAntiguos(){
  var limite=new Date();
  limite.setDate(limite.getDate()-14);
  db.collection("pedidos").get().then(function(snap){
    snap.forEach(function(doc){
      var fecha=new Date(doc.id.split("_")[1]);
      if(fecha<limite)db.collection("pedidos").doc(doc.id).delete();
    });
  });
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function verHistorial(){
  S.hist='<div style="text-align:center;color:#888;font-size:13px;padding:10px 0">Cargando...</div>';render();
  db.collection("pedidos").orderBy("__name__","desc").limit(10).get().then(function(snap){
    if(snap.empty){S.hist='<div style="text-align:center;color:#888;font-size:13px;padding:10px 0">No hay pedidos guardados</div>';render();return;}
    var out="";
    snap.forEach(function(doc){
      var d=doc.data();
      out+='<div style="margin-bottom:14px"><div style="font-weight:600;font-size:13px;margin-bottom:6px">'+esc(d.fecha)+'</div>';
      var provs={};
      d.items.forEach(function(i){if(!provs[i.p])provs[i.p]=[];provs[i.p].push(i);});
      Object.keys(provs).forEach(function(p){
        out+='<div style="font-size:12px;color:#3b82f6;font-weight:600;margin-top:4px">'+esc(p)+'</div>';
        provs[p].forEach(function(i){out+='<div style="font-size:13px;padding:2px 0">&bull; '+esc(i.c)+' '+esc(i.n)+'</div>';});
      });
      out+='</div>';
    });
    S.hist=out;render();
  }).catch(function(){S.hist='<div style="text-align:center;color:#dc2626;font-size:13px;padding:10px 0">Error al cargar historial</div>';render();});
}
function dlWA(){
  var lines=[];
  S.cat.forEach(function(g){
    var its=g.i.filter(function(i){return gv(g.p,i.n,"pedido","")!=="";});
    if(its.length===0)return;
    lines.push("*"+g.p+"*");
    its.forEach(function(i){lines.push("* "+gv(g.p,i.n,"pedido","")+" "+i.n);});
    lines.push("");
  });
  if(lines.length===0){alert("No hay pedidos ingresados");return;}
  var txt=encodeURIComponent(lines.join("\n"));
  savePedido(); window.open("https://wa.me/56940624005?text="+txt,"_blank");
}
function dlPed(){
  var lines=[];
  S.cat.forEach(function(g){
    var its=g.i.filter(function(i){return gv(g.p,i.n,"pedido","")!=="";});
    if(its.length===0)return;
    lines.push(g.p);
    its.forEach(function(i){lines.push("* "+i.n+" "+gv(g.p,i.n,"pedido",""));});
    lines.push("");
  });
  if(lines.length===0){alert("No hay pedidos ingresados");return;}
  var b=new Blob([lines.join("\n")],{type:"text/plain"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="pedido_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(u);
}
