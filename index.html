<style>
:root{
  --ink:#1a1a1a;
  --ink-2:#2a2a2a;
  --accent:#c9971f;
  --accent-soft:#f2e6c4;
  --cream:#efe9dc;
  --paper:#f6f2e8;
  --line:#999;
  --line-soft:#ccc;
  --text:#1a1a1a;
  --sub:#7a7568;
  --ok:#1a1a1a;
  --ok-soft:#e7e3d6;
  --danger:#a8402f;
  --danger-soft:#f2ddd6;
  --warn:#7a6224;
  --warn-soft:#ece2c4;
  --on-ink:#efe9dc;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Mono',monospace;background:var(--cream);color:var(--text);padding-bottom:140px;-webkit-font-smoothing:antialiased}
.hdr{background:var(--cream);padding:calc(14px + env(safe-area-inset-top)) 16px 0;border-bottom:1px dashed var(--line);position:sticky;top:0;z-index:10}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.oven-icon{width:20px;height:15px;flex-shrink:0;color:var(--ink)}
.brand-title{font-family:'Space Mono',monospace;font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--ink);line-height:1}
.brand-tag{font-size:10px;color:var(--sub);margin-top:2px;letter-spacing:.02em}
.fecha{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;margin-top:2px}
.smsg{font-size:10px;color:var(--accent);min-width:70px;text-align:right;letter-spacing:.02em}
.tabs{display:flex;border-bottom:1px dashed var(--line);margin:0 -16px}
.tab{flex:1;padding:9px 0;border:none;background:transparent;font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:#999}
.tab.active{background:var(--ink);color:var(--on-ink);border-bottom:2px solid var(--accent)}
.pb-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin:9px 0 4px;letter-spacing:.03em;text-transform:uppercase}
.pb{height:3px;background:var(--line-soft);margin-bottom:9px}
.pbf{height:3px;background:var(--accent);transition:width .3s}
.sec{padding:0 16px 4px}
.sb-wrap{padding:12px 16px 0}
.sb{width:100%;padding:9px 12px;border:1px solid var(--line);font-size:13px;font-family:'Space Mono',monospace;background:var(--paper);color:var(--text)}
.sb:focus{outline:none;border-color:var(--accent)}
body.dark .sb{background:#242017;border-color:var(--line);color:var(--text)}
.nores{padding:24px 0;text-align:center;color:var(--sub);font-size:12px}
.prov-grp{border-bottom:1px dashed var(--line)}
.prov-grp.open{background:var(--paper)}
.prov{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;padding:11px 2px;display:flex;align-items:baseline;cursor:pointer;user-select:none;gap:6px}
.prov-grp.open .prov{border-bottom:1px dashed var(--line-soft)}
.prov-name{display:flex;align-items:baseline;gap:6px;overflow:hidden;flex-shrink:0}
.prov-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0;display:none}
.prov-grp.haslow .prov-dot{display:block}
.prov-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prov-lead{flex:1;border-bottom:1px dotted #b3ac9c;margin:0 6px 3px;min-width:8px}
.prov-meta{display:flex;align-items:baseline;gap:6px;flex-shrink:0}
.prov-ct{font-family:'Space Mono',monospace;font-size:11px;font-weight:700}
.prov-chev{transition:transform .2s;font-size:9px;opacity:.7}
.prov-chev.open{transform:rotate(90deg)}
.prov-items{padding:2px 2px 4px;animation:fadein .15s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dotted var(--line-soft)}
.row:last-child{border-bottom:none}
.info{flex:1;min-width:0}
.nom{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.nom.proc{color:#a39c8c;text-decoration:line-through}
.mn{font-size:10px;color:var(--sub);margin-top:1px}
.mn.bajo{color:var(--danger);font-weight:700}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.chk.on{background:var(--ink)}
.chk.on::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--on-ink)}
.is{width:36px;text-align:center;font-size:12.5px;padding:5px 2px;border:1px solid var(--ink);background:var(--paper);color:var(--text);font-family:'Space Mono',monospace}
.is:focus{outline:none;border-color:var(--accent)}
.is.bajo{border-color:var(--danger);background:var(--danger-soft)}
.ip{width:38px;text-align:center;font-size:12.5px;padding:5px 2px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--text);font-family:'Space Mono',monospace}
.df{font-size:10px;flex-shrink:0;font-weight:700}
.df.up{color:var(--ink)}
.df.dn{color:var(--danger)}
.ap{padding:0 16px 12px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sc{background:var(--paper);border:1px solid var(--line-soft);padding:11px}
.sc .lbl{font-size:10px;color:var(--sub);margin-bottom:4px;letter-spacing:.03em;text-transform:uppercase}
.sc .val{font-family:'Space Mono',monospace;font-size:21px;font-weight:700}
.val.dng{color:var(--danger)}
.val.ok{color:var(--ink)}
.ab{background:var(--danger-soft);border:1px dashed var(--danger);padding:10px 12px;margin-bottom:12px}
.at{font-size:11px;font-weight:700;color:var(--danger);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.ai{font-size:11.5px;color:#7a2c1c;padding:2px 0}
.atbs{display:flex;gap:0;margin-bottom:12px;border-bottom:1px dashed var(--line)}
.atb{flex:1;padding:8px 0;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;border:none;background:transparent;color:var(--sub);font-family:'Space Mono',monospace}
.atb.active{background:var(--ink);color:var(--on-ink);font-weight:700}
.af{background:var(--paper);border:1px dashed var(--line);padding:14px}
.fld{margin-bottom:10px}
.fld label{font-size:10px;color:var(--sub);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.fld input,.fld select{width:100%;padding:8px 10px;border:1px solid var(--line);font-size:13px;background:var(--paper);color:var(--text);font-family:'Space Mono',monospace}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:10px 0;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;border:1.5px solid var(--ink);margin-top:4px;font-family:'Space Mono',monospace;background:var(--paper);color:var(--ink)}
.btnp{background:var(--paper);color:var(--ink);border-color:var(--accent)}
.btns{background:var(--paper);color:var(--text);border-color:var(--line)}
.btnr{background:var(--paper);color:var(--danger);border-color:var(--danger)}
.ebs{display:flex;gap:6px;flex-shrink:0}
.be{font-size:11px;padding:5px 9px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;font-family:'Space Mono',monospace;font-weight:700}
.bd{font-size:11px;padding:5px 9px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);cursor:pointer;font-family:'Space Mono',monospace;font-weight:700}
.ftr{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--cream);border-top:1px dashed var(--line)}
.ftri{max-width:480px;margin:0 auto;display:flex;gap:6px;align-items:center}
.ftrc{flex:1;font-size:10.5px;color:var(--sub)}
.mo{position:fixed;inset:0;background:rgba(20,16,10,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--paper);padding:20px;width:100%;max-width:380px;border:2px solid var(--accent);outline:1px solid var(--accent);outline-offset:4px}
.mt{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;margin-bottom:14px;text-transform:uppercase;letter-spacing:.03em}
.mbs{display:flex;gap:8px;margin-top:12px}

body.dark{--cream:#1a1712;--paper:#221e16;--line:#5a5340;--line-soft:#443f30;--text:#e8e2d1;--sub:#a89f8a;background:var(--cream);color:var(--text)}
body.dark .prov-grp.open{background:var(--paper)}
body.dark .row{border-bottom-color:var(--line-soft)}
body.dark .is{background:#2a2419;border-color:var(--ink-text,var(--text));color:var(--text)}
body.dark .ip{background:#3a2c12;border-color:var(--warn);color:var(--text)}
body.dark .sc{background:var(--paper);border-color:var(--line-soft)}
body.dark .ab{background:#3a1d16;border-color:var(--danger)}
body.dark .ai{color:#f0b09e}
body.dark .af{background:var(--paper);border-color:var(--line)}
body.dark .fld input,body.dark .fld select{background:#2a2419;border-color:var(--line-soft);color:var(--text)}
body.dark .btns{background:#2a2419;color:var(--text);border-color:var(--line-soft)}
body.dark .btn{color:var(--text);border-color:var(--text)}
body.dark .btnp{border-color:var(--accent)}
body.dark .btnr{color:var(--danger);border-color:var(--danger)}
body.dark .md{background:var(--paper)}
body.dark .ftr{background:var(--cream);border-color:var(--line-soft)}
body.dark .hdr{background:var(--cream);border-color:var(--line-soft)}
body.dark .nom.proc{color:#7d7263}
body.dark .atbs{border-color:var(--line-soft)}
body.dark .be{background:#2a2419;border-color:var(--line-soft);color:var(--text)}
body.dark .chk{background:#2a2419;border-color:var(--text)}
body.dark .chk.on{background:var(--text)}
body.dark .chk.on::after{background:var(--cream)}
body.dark .brand-title,body.dark .oven-icon{color:var(--text)}
body.dark .prov{color:var(--text)}
body.dark .prov-check{color:var(--text)}
body.dark .val.ok{color:var(--text)}
body.dark .df.up{color:var(--text)}
body.dark .fab{color:var(--text)}
body.dark .lock-logo{color:var(--text)}
body.dark .tab{color:#8a8272}
body.dark .sb{background:#2a2419;border-color:var(--line-soft);color:var(--text)}
.dark-toggle{cursor:pointer;font-size:16px;padding:4px 7px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
body.dark .dark-toggle{color:var(--text);border-color:var(--line-soft)}

.stp{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stp-b{width:28px;height:28px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;font-family:'Space Mono',monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.stp-b:active{background:var(--accent-soft);border-color:var(--accent)}
.stp-b.wide{width:34px;font-size:10px}
body.dark .stp-b{background:#2a2419;border-color:var(--text);color:var(--text)}
.mrow{padding:9px 2px;border-bottom:1px dashed var(--line-soft)}
.mrow:last-child{border-bottom:none}
.msel-btn{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;padding:5px 7px;border:1px solid var(--line);background:var(--paper);color:var(--sub);cursor:pointer;flex-shrink:0}
.msel-btn.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.mrow.msel{background:var(--accent-soft);margin:0 -8px;padding:9px 8px;border-bottom:1px dashed var(--accent)}
.mrow.msel.mdone{background:var(--ok-soft);border-bottom-color:var(--line-soft)}
body.dark .mrow.msel{background:#3a2c12}
body.dark .mrow.msel.mdone{background:#1e2a1e}

.row.ok .nom{color:var(--sub);text-decoration:line-through}
.row.low{background:var(--danger-soft)}
body.dark .row.low{background:#3a1d16}

.prov-ring{display:none}
.prov-check{display:none;color:var(--ink);font-weight:700}
.prov-grp.done .prov-check{display:inline}
.prov-grp.done .prov{color:var(--sub)}
.prov-grp.done .prov-ct{opacity:.6}
.prov-grp.done.haslow .prov{color:var(--danger)}
body.dark .prov-grp.done .prov{color:var(--sub)}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:10px 18px;z-index:200;border:1px solid var(--accent);animation:pop .3s ease;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.toast.out{opacity:0;transition:opacity .3s}

#cf{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.cfp{position:absolute;width:7px;height:7px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(600deg);opacity:.9}}

.fab{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px 0;border:1.5px solid var(--accent);background:var(--paper);color:var(--ink);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.fab.done{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.prog-msg{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lockwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;background:var(--cream)}
.lock-logo{width:52px;height:38px;color:var(--ink);margin-bottom:2px}
.lock-card{background:var(--paper);padding:24px;width:100%;max-width:300px;border:2px solid var(--accent);outline:1px solid var(--accent);outline-offset:4px;text-align:center}
.lock-lbl{font-family:'Space Mono',monospace;font-size:11px;color:var(--sub);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.lock-inp{width:100%;text-align:center;font-size:22px;letter-spacing:.3em;padding:10px 0;border:1px solid var(--ink);background:var(--cream);color:var(--text);font-family:'Space Mono',monospace;margin-bottom:12px}
.lock-inp:focus{outline:none;border-color:var(--accent)}
.lock-err{color:var(--danger);font-size:11px;margin-bottom:10px}
</style>
</head>

function updStock(p,n,v){
  var a=AR();
  var wasP=provDone(p), wasAll=(tot()>0&&fil()===tot());
  var k=bk(p,n);a.sk=Object.assign({},a.sk);a.sk[k]=Object.assign({},a.sk[k]||{});a.sk[k]["stock"]=v;
  var row=document.querySelector('[data-p="'+p+'"][data-n="'+n+'"]');
  var grp=a.cat.find(function(g){return g.p===p;});
  var item=grp&&grp.i.find(function(i){return i.n===n;});
  var sn=parseFloat(v);
  var bajo=!!(item&&!isNaN(sn)&&item.m>0&&sn<item.m);
  if(row){
    var inp=row.querySelector("[data-action=stock]");
    if(inp)inp.className="is"+(bajo?" bajo":"");
    var mn=row.querySelector(".mn");
    if(mn){mn.className="mn"+(bajo?" bajo":"");mn.textContent="min:"+(item?item.m:"")+(bajo?" BAJO":"");}
    row.classList.toggle("low",bajo);
    row.classList.toggle("ok",!bajo&&v!=="");
  }
  refreshChip(p);refreshProgress();
  if(!wasP&&provDone(p)&&fil()!==tot()){buzz([14,60,14]);toast(p+" listo");}
  if(!wasAll&&tot()>0&&fil()===tot()){buzz([20,80,20,80,20]);confetti();toast("\u00a1Inventario completo!");checkRacha();}
  saveS();
}

function dlInv(){

  var b=new Blob([lines.join("\n")],{type:"text/plain"});

function savePedido(){
  var items=[];
  AR().cat.forEach(function(g){
    g.i.forEach(function(i){
      var v=gv(g.p,i.n,"pedido","");
      if(v!=="")items.push({p:g.p,n:i.n,c:v});
    });
  });
  if(items.length===0)return;
  var pedidosCol=AREAS[curArea()].pedidosCol;
  var key="pedido_"+new Date().toISOString().slice(0,10)+"_"+Date.now();
  var pedido={fecha:new Date().toLocaleDateString("es-CL"),items:items};
  db.collection(pedidosCol).doc(key).set(pedido).then(function(){
    limpiarPedidosAntiguos();
  }).catch(function(e){
    alert("No se pudo guardar el registro del pedido (el mensaje de WhatsApp se abre igual): "+(e.message||e.code||e));
  });
}
function limpiarPedidosAntiguos(){
  var limite=new Date();
  limite.setDate(limite.getDate()-14);
  var pedidosCol=AREAS[curArea()].pedidosCol;
  db.collection(pedidosCol).get().then(function(snap){
    snap.forEach(function(doc){
      var fecha=new Date(doc.id.split("_")[1]);
      if(fecha<limite)db.collection(pedidosCol).doc(doc.id).delete();
    });
  });
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function diffDias(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function checkRacha(){
  var area=curArea(),cfg=AREAS[area],a=AR();
  var hoy=today();
  if(a.racha.ultimaFecha===hoy)return;
  var d=a.racha.ultimaFecha?diffDias(a.racha.ultimaFecha,hoy):null;
  a.racha=Object.assign({},a.racha,{actual:(d===1?a.racha.actual+1:1),ultimaFecha:hoy});
  a.racha.mejor=Math.max(a.racha.mejor||0,a.racha.actual);
  db.collection("gratinata").doc(cfg.rachaDoc).set(a.racha);
  render();
  if(a.racha.actual>1){setTimeout(function(){buzz([10,40,10,40,10]);toast("Racha: "+a.racha.actual+" dias");},1600);}
}

var NIVELES=[{min:30,n:"MAESTRO DEL CIERRE"},{min:16,n:"JEFE DE TURNO"},{min:8,n:"COCINERO"},{min:3,n:"AYUDANTE"},{min:0,n:"APRENDIZ"}];
function nivelPorCantidad(n){for(var i=0;i<NIVELES.length;i++){if(n>=NIVELES[i].min)return NIVELES[i].n;}return NIVELES[NIVELES.length-1].n;}
function verRanking(){
  var cfg=CIERRE_DEPTOS[CD()];
  CR().ranking='<div style="text-align:center;color:var(--sub);font-size:12px;padding:10px 0">Cargando...</div>';render();
  db.collection(cfg.histCol).get().then(function(snap){
    var counts={};
    snap.forEach(function(doc){var d=doc.data();var n=(d.nombre||"?").trim();counts[n]=(counts[n]||0)+1;});
    var arr=Object.keys(counts).map(function(n){return {nombre:n,cant:counts[n]};});
    arr.sort(function(a,b){return b.cant-a.cant;});
    if(arr.length===0){CR().ranking='<div style="text-align:center;color:var(--sub);font-size:12px;padding:10px 0">Aun no hay cierres registrados</div>';render();return;}
    var out="";
    arr.forEach(function(r,i){
      out+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line-soft)">';
      out+='<div style="font-weight:700;font-size:13px;width:20px">'+(i+1)+'</div>';
      out+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12.5px;text-transform:uppercase">'+esc(r.nombre)+'</div><div style="font-size:10px;color:var(--accent);letter-spacing:.03em">'+nivelPorCantidad(r.cant)+'</div></div>';
      out+='<div style="font-weight:700;font-size:13px">'+r.cant+'</div>';
      out+='</div>';
    });
    CR().ranking=out;render();
  }).catch(function(e){CR().ranking='<div style="text-align:center;color:var(--danger);font-size:12px;padding:10px 0">Error: '+esc(e.message||e.code||String(e))+'</div>';render();});
}

  S.mise.dia=Object.assign({},S.mise.dia,{sel:Object.assign({},S.mise.dia.sel),hecho:Object.assign({},S.mise.dia.hecho)});
  var nuevo=!S.mise.dia.sel[name];

function toggleMiseHecho(name){
  if(!S.mise.dia.sel[name])return;
  S.mise.dia=Object.assign({},S.mise.dia,{hecho:Object.assign({},S.mise.dia.hecho)});
  S.mise.dia.hecho[name]=!S.mise.dia.hecho[name];
  buzz(10);
  var sel=Object.keys(S.mise.dia.sel).filter(function(k){return S.mise.dia.sel[k];});
  var done=sel.filter(function(k){return S.mise.dia.hecho[k];});

}
function removeMiseItem(nombre){
  if(!confirm('¿Eliminar "'+nombre+'" de Mise en Place?'))return;
  S.mise.cat=S.mise.cat.filter(function(i){return i.n!==nombre;});
  saveMiseCat();render();
}
function editMiseMin(nombre,min){
  S.mise.cat=S.mise.cat.map(function(i){return i.n!==nombre?i:Object.assign({},i,{m:parseFloat(min)||0});});
  saveMiseCat();
}
function finalizarMise(){
  var selKeys=Object.keys(S.mise.dia.sel).filter(function(k){return S.mise.dia.sel[k];});
  if(selKeys.length===0){alert("No hay productos seleccionados para guardar en el historial");return;}
  var snap={
    fecha:new Date().toLocaleDateString("es-CL"),
    guardadoEn:new Date().toISOString(),
    items:selKeys.map(function(n){
      return {n:n,linea:S.mise.dia.linea[n]||"",repuesto:S.mise.dia.repuesto[n]||"",producir:S.mise.dia.producir[n]||"",hecho:!!S.mise.dia.hecho[n]};
    })
  };
  var key="mise_"+today()+"_"+Date.now();
  db.collection("miseHistorial").doc(key).set(snap).then(function(){
    S.msg="Guardado en historial";render();setTimeout(function(){S.msg="";render();},2000);
  }).catch(function(e){alert("No se pudo guardar: "+(e.message||e.code||e));});
}
function verMiseHistorial(){
  S.mise.hist='<div style="text-align:center;color:var(--sub);font-size:12px;padding:10px 0">Cargando...</div>';render();
  db.collection("miseHistorial").get().then(function(snap){
    if(snap.empty){S.mise.hist='<div style="text-align:center;color:var(--sub);font-size:12px;padding:10px 0">No hay historial guardado</div>';render();return;}
    var docs=[];
    snap.forEach(function(doc){docs.push(doc);});
    docs.sort(function(a,b){return a.id<b.id?1:(a.id>b.id?-1:0);});
    docs=docs.slice(0,10);
    var out="";
    docs.forEach(function(doc){
      var d=doc.data();
      var done=d.items.filter(function(i){return i.hecho;});
      var pend=d.items.filter(function(i){return !i.hecho;});
      out+='<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)">';
      out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:700;font-size:12.5px">'+esc(d.fecha)+'</div><span style="font-size:11px;font-weight:700;color:var(--accent)">'+done.length+'/'+d.items.length+'</span></div>';
      d.items.forEach(function(i){
        out+='<div style="font-size:11.5px;padding:2px 0;'+(i.hecho?"text-decoration:line-through;color:var(--sub)":"")+'">'+(i.hecho?"[X] ":"[ ] ")+esc(i.n)+(i.producir?" &mdash; producir:"+esc(i.producir):"")+'</div>';
      });
      out+='</div>';
    });
    S.mise.hist=out;render();
  }).catch(function(e){S.mise.hist='<div style="text-align:center;color:var(--danger);font-size:12px;padding:10px 0">Error: '+esc(e.message||e.code||String(e))+'</div>';render();});
}
function cierreTot(){return CR().areas.reduce(function(a,g){return a+g.t.length;},0);}
function cierreFil(){var t=CR().turno;if(!t)return 0;return Object.keys(t.tareas||{}).filter(function(k){return t.tareas[k];}).length;}
function saveCierreAreas(){db.collection("gratinata").doc(CIERRE_DEPTOS[CD()].areasDoc).set({areas:CR().areas});}
function startTurno(nombre){
  if(!nombre||!nombre.trim())return;
  var snapshot=CR().areas.map(function(g){return {n:g.n,t:g.t.slice()};});
  var turno={nombre:nombre.trim(),fecha:new Date().toLocaleDateString("es-CL"),tareas:{},finalizado:false,creadoEn:new Date().toISOString(),areasSnapshot:snapshot};
  CR().turno=turno;
  db.collection(CIERRE_DEPTOS[CD()].turnosCol).doc(today()).set(turno);
  render();
}
function cancelTurno(){
  if(!confirm("¿Cancelar este checklist? Se perdera todo el progreso marcado."))return;
  var dept=CD();
  CR().turno=null;
  db.collection(CIERRE_DEPTOS[dept].turnosCol).doc(today()).delete();
  render();
}
function toggleTareaCierre(area,tarea){
  if(!CR().turno)return;
  var dept=CD();
  var k=area+"||"+tarea;
  CR().turno=Object.assign({},CR().turno,{tareas:Object.assign({},CR().turno.tareas)});
  CR().turno.tareas[k]=!CR().turno.tareas[k];
  buzz(10);
  db.collection(CIERRE_DEPTOS[dept].turnosCol).doc(today()).set(CR().turno);
  render();
  if(cierreFil()===cierreTot()&&cierreTot()>0){buzz([20,80,20,80,20]);confetti();toast("¡Cierre completo!");}
}
function pendientesDeTurno(turno,areas){
  var out=[];
  (areas||[]).forEach(function(g){
    var pend=g.t.filter(function(tk){return !(turno.tareas&&turno.tareas[g.n+"||"+tk]);});
    if(pend.length>0)out.push({area:g.n,tareas:pend});
  });
  return out;
}
function finalizarTurno(){
  if(!CR().turno)return;
  var dept=CD(),cfg=CIERRE_DEPTOS[dept];
  var t=Object.assign({},CR().turno,{finalizado:true,finalizadoEn:new Date().toISOString()});
  var key="cierre_"+today()+"_"+Date.now();
  var pend=pendientesDeTurno(t,t.areasSnapshot||CR().areas);
  // Se envia de inmediato (dentro del mismo click) para que el navegador no bloquee la apertura de WhatsApp.
  if(pend.length>0){
    if(S.alertaWa){
      var lines=["*Cierre de "+cfg.label+" incompleto*","Responsable: "+t.nombre,"Fecha: "+t.fecha,""];
      pend.forEach(function(p){lines.push("*"+p.area+"*: "+p.tareas.join(", "));});
      window.open("https://wa.me/"+S.alertaWa+"?text="+encodeURIComponent(lines.join("\n")),"_blank");
    } else {
      toast("Cierre incompleto (sin WhatsApp de alertas configurado)");
    }
  }
  db.collection(cfg.histCol).doc(key).set(t).then(function(){
    db.collection(cfg.turnosCol).doc(today()).delete();
    CR().turno=null;
    S.msg=(pend.length>0&&S.alertaWa)?"Guardado, aviso enviado":"Checklist guardado";
    render();
    setTimeout(function(){S.msg="";render();},2500);
    cierresDe(t.nombre,function(n){
      if(n===null)return;
      var nivelAntes=nivelPorCantidad(n-1),nivelAhora=nivelPorCantidad(n);
      setTimeout(function(){
        if(nivelAhora!==nivelAntes){buzz([15,50,15,50,15,50,15]);confetti();toast("¡Subiste a "+nivelAhora+"!");}
        else{buzz(10);toast(t.nombre.split(" ")[0]+": "+n+" cierres ("+nivelAhora+")");}
      },1700);
    });
  }).catch(function(e){
    alert("No se pudo guardar el checklist: "+(e.message||e.code||e));
  });
}

function verCierreHistorial(){
  var dept=CD(),cfg=CIERRE_DEPTOS[dept];
  CR().hist='<div style="text-align:center;color:#888;font-size:13px;padding:10px 0">Cargando...</div>';render();
  db.collection(cfg.histCol).get().then(function(snap){
    if(snap.empty){CR().hist='<div style="text-align:center;color:#888;font-size:13px;padding:10px 0">No hay checklists guardados</div>';render();return;}
    var docs=[];
    snap.forEach(function(doc){docs.push(doc);});
    docs.sort(function(a,b){return a.id<b.id?1:(a.id>b.id?-1:0);});
    docs=docs.slice(0,10);
    var out="";
    docs.forEach(function(doc){
      var d=doc.data();
      var areas=d.areasSnapshot||CR().areas;
      var totTareas=0,doneTareas=0,detalle="";
      areas.forEach(function(g){
        var doneG=g.t.filter(function(tk){return d.tareas&&d.tareas[g.n+"||"+tk];});
        var pend=g.t.filter(function(tk){return !(d.tareas&&d.tareas[g.n+"||"+tk]);});
        totTareas+=g.t.length;doneTareas+=doneG.length;
        var completo=g.t.length>0&&pend.length===0;
        detalle+='<div style="font-size:12px;padding:2px 0"><b>'+esc(g.n)+'</b>: '+doneG.length+'/'+g.t.length+' &mdash; '+(g.t.length===0?'sin tareas':(completo?'<span style="color:var(--ok)">completo</span>':'<span style="color:var(--danger)">pendiente: '+esc(pend.join(", "))+'</span>'))+'</div>';
      });
      var pct=totTareas>0?Math.round(doneTareas/totTareas*100):0;
      var badgeCls=pct===100?"var(--ok-soft)":"var(--warn-soft)";
      var badgeColor=pct===100?"var(--ok)":"var(--warn)";
      out+='<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)">';
      out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div><div style="font-weight:600;font-size:13.5px">'+esc(d.nombre)+'</div><div style="font-size:11.5px;color:var(--sub)">'+esc(d.fecha)+'</div></div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span style="background:'+badgeCls+';color:'+badgeColor+';font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px">'+pct+'% ('+doneTareas+'/'+totTareas+')</span><button class="bd" data-delhist-col="'+cfg.histCol+'" data-delhist-id="'+doc.id+'" data-delhist-fn="cierre">Eliminar</button></div></div>';
      out+=detalle;
      out+='</div>';
    });
    CR().hist=out;render();
  }).catch(function(e){CR().hist='<div style="text-align:center;color:var(--danger);font-size:12.5px;padding:10px 0">Error: '+esc(e.message||e.code||String(e))+'</div>';render();});
}
function addCierreArea(nombre){
  if(!nombre||!nombre.trim())return;
  var n=nombre.trim().toUpperCase();
  if(CR().areas.some(function(g){return g.n===n;})){alert('El area "'+n+'" ya existe');return;}
  CR().areas=CR().areas.concat([{n:n,t:[]}]);
  S.cierre.newAreaName="";
  saveCierreAreas();render();
}
function renameCierreArea(nombre){
  var nuevo=prompt('Nuevo nombre para "'+nombre+'"',nombre);
  if(!nuevo||!nuevo.trim())return;
  var n=nuevo.trim().toUpperCase();
  if(n===nombre)return;
  if(CR().areas.some(function(g){return g.n===n;})){alert('Ya existe un area llamada "'+n+'"');return;}
  CR().areas=CR().areas.map(function(g){return g.n!==nombre?g:Object.assign({},g,{n:n});});
  saveCierreAreas();render();
}
function removeCierreArea(nombre){
  if(!confirm('¿Eliminar el area "'+nombre+'" y todas sus tareas?'))return;
  CR().areas=CR().areas.filter(function(g){return g.n!==nombre;});
  saveCierreAreas();render();
}
function addCierreTask(area,tarea){
  if(!tarea||!tarea.trim())return;
  CR().areas=CR().areas.map(function(g){return g.n!==area?g:Object.assign({},g,{t:g.t.concat([tarea.trim()])});});
  S.cierre.newTaskInput[area]="";
  saveCierreAreas();render();
}
function removeCierreTask(area,idx){
  CR().areas=CR().areas.map(function(g){return g.n!==area?g:Object.assign({},g,{t:g.t.filter(function(x,i){return i!==idx;})});});
  saveCierreAreas();render();
}
function verHistorial(){
  S.hist='<div style="text-align:center;color:#888;font-size:13px;padding:10px 0">Cargando...</div>';render();
  var pedidosCol=AREAS[curArea()].pedidosCol;
  db.collection(pedidosCol).get().then(function(snap){
    if(snap.empty){S.hist='<div style="text-align:center;color:#888;font-size:13px;padding:10px 0">No hay pedidos guardados</div>';render();return;}
    var docs=[];
    snap.forEach(function(doc){docs.push(doc);});
    docs.sort(function(a,b){return a.id<b.id?1:(a.id>b.id?-1:0);});
    docs=docs.slice(0,10);
    var out="";
    docs.forEach(function(doc){
      var d=doc.data();
      out+='<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:600;font-size:13px">'+esc(d.fecha)+'</div><button class="bd" data-delhist-col="'+pedidosCol+'" data-delhist-id="'+doc.id+'" data-delhist-fn="pedidos">Eliminar</button></div>';
      var provs={};
      d.items.forEach(function(i){if(!provs[i.p])provs[i.p]=[];provs[i.p].push(i);});
      Object.keys(provs).forEach(function(p){
        out+='<div style="font-size:12px;color:#3b82f6;font-weight:600;margin-top:4px">'+esc(p)+'</div>';
        provs[p].forEach(function(i){out+='<div style="font-size:13px;padding:2px 0">&bull; '+esc(i.c)+' '+esc(i.n)+'</div>';});
      });
      out+='</div>';
    });
    S.hist=out;render();
  }).catch(function(e){S.hist='<div style="text-align:center;color:#dc2626;font-size:12.5px;padding:10px 0">Error: '+esc(e.message||e.code||String(e))+'</div>';render();});
}
function deleteHistorialDoc(col,id,tipo){
  if(!confirm("¿Eliminar este registro del historial? No se puede deshacer."))return;
  db.collection(col).doc(id).delete().then(function(){
    if(tipo==="pedidos")verHistorial();
    else verCierreHistorial();
  }).catch(function(e){alert("No se pudo eliminar: "+(e.message||e.code||e));});
}
function sendProvWA(entry){
  var lines=["*"+entry.p+"*"];
  entry.its.forEach(function(i){lines.push("* "+gv(entry.p,i.n,"pedido","")+" "+i.n);});
  var txt=encodeURIComponent(lines.join("\n"));
  if(!entry.wa){alert('Falta el numero de WhatsApp de "'+entry.p+'". Agregalo en Modo administrador > Editar.');return;}
  window.open("https://wa.me/"+entry.wa+"?text="+txt,"_blank");
}
function dlWA(){
  var byProv=[];
  AR().cat.forEach(function(g){
    var its=g.i.filter(function(i){return gv(g.p,i.n,"pedido","")!=="";});
    if(its.length===0)return;
    byProv.push({p:g.p,wa:g.wa||"",its:its});
  });
  if(byProv.length===0){alert("No hay pedidos ingresados");return;}
  savePedido();
  if(byProv.length===1){sendProvWA(byProv[0]);return;}
  S.waPick=byProv;render();
}
function dlPed(){
  var lines=[];
  AR().cat.forEach(function(g){
    var its=g.i.filter(function(i){return gv(g.p,i.n,"pedido","")!=="";});
    if(its.length===0)return;
    lines.push(g.p);
    its.forEach(function(i){lines.push("* "+i.n+" "+gv(g.p,i.n,"pedido",""));});
    lines.push("");
  });
  if(lines.length===0){alert("No hay pedidos ingresados");return;}
  var b=new Blob([lines.join("\n")],{type:"text/plain"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="pedido_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(u);
}
load();
window.addEventListener("online",function(){buzz(10);render();});
window.addEventListener("offline",function(){buzz([15,60,15]);render();});
</script>
