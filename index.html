<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a;padding-bottom:90px}
.hdr{background:#fff;padding:14px 16px 10px;border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:10}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fecha{font-size:12px;color:#888;text-transform:capitalize}
.smsg{font-size:12px;color:#22c55e;min-width:80px;text-align:right}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:8px 0;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:14px;cursor:pointer;color:#666}
.tab.active{border:1.5px solid #3b82f6;background:#eff6ff;color:#1d4ed8;font-weight:500}
.pb-lbl{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.pb{height:5px;background:#e5e5e5;border-radius:99px}
.pbf{height:5px;background:#3b82f6;border-radius:99px;transition:width .3s}
.sec{padding:0 16px}
.prov{font-size:11px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;margin:10px 0 4px;border-radius:6px;background:#3b82f6;display:inline-block}
.row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f0f0f0}
.info{flex:1;min-width:0}
.nom{font-size:13px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nom.proc{color:#aaa}
.mn{font-size:11px;color:#888}
.mn.bajo{color:#ef4444}
.chk{width:20px;height:20px;border-radius:4px;border:1px solid #ccc;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff}
.chk.on{border-color:#22c55e;background:#f0fdf4}
.chk.on::after{content:'OK';font-size:10px;color:#22c55e}
.is{width:56px;text-align:center;font-size:14px;padding:5px 4px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a}
.is.bajo{border-color:#ef4444}
.ip{width:52px;text-align:center;font-size:14px;padding:5px 4px;border-radius:8px;border:1px solid #f59e0b;background:#fffbeb;color:#1a1a1a}
.df{font-size:11px;flex-shrink:0}
.df.up{color:#22c55e}
.df.dn{color:#ef4444}
.ap{padding:0 16px 12px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sc{background:#fff;border-radius:10px;padding:12px}
.sc .lbl{font-size:12px;color:#888;margin-bottom:4px}
.sc .val{font-size:22px;font-weight:600}
.val.dng{color:#ef4444}
.val.ok{color:#22c55e}
.ab{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.at{font-size:13px;font-weight:600;color:#dc2626;margin-bottom:6px}
.ai{font-size:12px;color:#dc2626;padding:2px 0}
.atbs{display:flex;gap:6px;margin-bottom:10px}
.atb{flex:1;padding:6px 0;font-size:13px;border-radius:8px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666}
.atb.active{border:1.5px solid #3b82f6;background:#eff6ff;color:#1d4ed8;font-weight:500}
.af{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px}
.fld{margin-bottom:8px}
.fld label{font-size:12px;color:#888;display:block;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;font-size:14px;background:#fff;color:#1a1a1a}
.btn{width:100%;padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;border:none;margin-top:4px}
.btnp{background:#3b82f6;color:#fff;font-weight:500}
.btns{background:#fff;color:#444;border:1px solid #ddd}
.btnr{background:#fff;color:#ef4444;border:1px solid #fecaca}
.ebs{display:flex;gap:6px;flex-shrink:0}
.be{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333;cursor:pointer}
.bd{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;cursor:pointer}
.ftr{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:#fff;border-top:1px solid #e5e5e5}
.ftri{max-width:480px;margin:0 auto;display:flex;gap:6px;align-items:center}
.ftrc{flex:1;font-size:12px;color:#888}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px}
.mt{font-size:15px;font-weight:600;margin-bottom:14px}
.mbs{display:flex;gap:8px;margin-top:12px}

body.dark{background:#1a1a1a;color:#f0f0f0}
body.dark .hdr{background:#2a2a2a;border-bottom-color:#444}
body.dark .tab{background:#2a2a2a;border-color:#444;color:#aaa}
body.dark .tab.active{background:#1d3a6e;border-color:#3b82f6;color:#93c5fd}
body.dark .row{border-bottom-color:#333}
body.dark .is{background:#2a2a2a;border-color:#444;color:#f0f0f0}
body.dark .ip{background:#3a2a00;border-color:#f59e0b;color:#f0f0f0}
body.dark .sc{background:#2a2a2a}
body.dark .ab{background:#3a1a1a;border-color:#7f1d1d}
body.dark .af{background:#2a2a2a;border-color:#444}
body.dark .fld input,.dark .fld select{background:#333;border-color:#555;color:#f0f0f0}
body.dark .btns{background:#2a2a2a;color:#ccc;border-color:#444}
body.dark .md{background:#2a2a2a}
body.dark .ftr{background:#2a2a2a;border-top-color:#444}
.dark-toggle{cursor:pointer;font-size:20px;padding:2px 6px;border-radius:8px;border:none;background:transparent;color:inherit}

body.dark .nom{color:#f0f0f0}
body.dark .mn{color:#aaa}
body.dark .prov{background:#1d4ed8}
body.dark .hdr-top div div{color:#f0f0f0}
body.dark .fecha{color:#aaa}
body.dark .smsg{color:#4ade80}
body.dark .pb-lbl{color:#aaa}
body.dark .pb{background:#333}
body.dark .atb{background:#2a2a2a;border-color:#444;color:#aaa}
body.dark .atb.active{background:#1d3a6e;color:#93c5fd}
body.dark .sc .lbl{color:#aaa}
body.dark .sc .val{color:#f0f0f0}
body.dark .ftrc{color:#aaa}
body.dark .be{background:#2a2a2a;border-color:#555;color:#ccc}
</style>
</head>

var pwk=function(){var d=new Date();d.setDate(d.getDate()-7);var w=Math.ceil(d.getDate()/7);return d.getFullYear()+"-"+(d.getMonth()+1)+"-w"+w;};
var bk=function(p,n){return p+"||"+n;};
var S={mode:"cocina",tab:"ver",sk:{},pv:{},cat:INV,msg:"",modal:null,ni:{p:"",n:"",m:""},ap:""};
var st=null;
function load(){
  db.collection("gratinata").doc("catalogo").get().then(function(c){if(c.exists)S.cat=c.data().items||INV;})
  .then(function(){return db.collection("stock").doc(wk()).get();})

  .then(function(){return db.collection("stock").doc(pwk()).get();})
  .then(function(p){if(p.exists)S.pv=p.data().entries||{};})
  .catch(function(e){console.error(e);})
  .finally(function(){
    render();
    db.collection("stock").doc(wk()).onSnapshot(function(s){if(s.exists){S.sk=s.data().entries||{};if(!escribiendo)render();}});
  });
}
function saveS(){

  st=setTimeout(function(){
    db.collection("stock").doc(wk()).set({entries:S.sk,updatedAt:new Date().toISOString()})

    .catch(function(){S.msg="Error";render();});
  },600);
}
function saveCat(){db.collection("gratinata").doc("catalogo").set({items:S.cat});}
function gv(p,n,f,fb){var k=bk(p,n);if(fb===undefined)fb="";return(S.sk[k]&&S.sk[k][f]!==undefined)?S.sk[k][f]:fb;}
function gp(p,n){var k=bk(p,n);return(S.pv[k]&&S.pv[k].stock!==undefined)?S.pv[k].stock:null;}

function upd(p,n,f,v,norender){var k=bk(p,n);S.sk=Object.assign({},S.sk);S.sk[k]=Object.assign({},S.sk[k]||{});S.sk[k][f]=v;S.msg="Guardando...";saveS();if(norender)return;clearTimeout(renderTimeout);renderTimeout=setTimeout(render,5000);}

function updStock(p,n,v){var k=bk(p,n);S.sk=Object.assign({},S.sk);S.sk[k]=Object.assign({},S.sk[k]||{});S.sk[k]["stock"]=v;var row=document.querySelector('[data-p="'+p+'"][data-n="'+n+'"]');if(row){var inp=row.querySelector("[data-action=stock]");if(inp){var sn=parseFloat(v);var grp=S.cat.find(function(g){return g.p===p;});var item=grp&&grp.i.find(function(i){return i.n===n;});var bajo=item&&!isNaN(sn)&&item.m>0&&sn<item.m;inp.className="is"+(bajo?" bajo":"");var mn=row.querySelector(".mn");if(mn)mn.className="mn"+(bajo?" bajo":"");}}var f=fil(),t=tot(),pct=t>0?Math.round(f/t*100):0;var pb=document.querySelector(".pbf");if(pb)pb.style.width=pct+"%";var pbl=document.querySelector(".pb-lbl");if(pbl)pbl.innerHTML='<span>Progreso</span><span>'+f+'/'+t+'</span>';saveS();}
function tot(){return S.cat.reduce(function(a,g){return a+g.i.length;},0);}
function fil(){return S.cat.reduce(function(a,g){return a+g.i.filter(function(i){return gv(g.p,i.n,"stock")!=="";}).length;},0);}
function low(){return S.cat.reduce(function(a,g){return a.concat(g.i.filter(function(i){var s=parseFloat(gv(g.p,i.n,"stock",""));return !isNaN(s)&&i.m>0&&s<i.m;}).map(function(i){return {n:i.n,m:i.m,p:g.p};}));},[]); }
function wl(){return new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});}

  var m=S.mode,tab=S.tab;

  h+='<div class="tabs">';

  if(m==="administrador"){
    h+='<div class="ap"><div class="sg"><div class="sc"><div class="lbl">Bajo minimo</div><div class="val '+(lw.length>0?"dng":"ok")+'">'+lw.length+'</div></div><div class="sc"><div class="lbl">Completado</div><div class="val">'+pct+'%</div></div></div>';
    if(lw.length>0){h+='<div class="ab"><div class="at">Bajo minimo</div>';lw.forEach(function(i){h+='<div class="ai">'+i.n+' stock:'+gv(i.p,i.n,"stock")+'/min:'+i.m+' ('+i.p+')</div>';});h+='</div>';}

  if(m==="administrador"&&tab==="ver")h+='<div class="ftr"><div class="ftri"><button class="btn btns" style="flex:1;font-size:12px" id="btn-inv">Inventario</button><button class="btn btnp" style="flex:1;font-size:11px" id="btn-ped">Pedido</button><button class="btn" style="flex:1;font-size:11px;background:#25d366;color:#fff" id="btn-wa">WhatsApp</button><button class="btn" style="flex:1;font-size:11px;background:#6366f1;color:#fff" id="btn-hist">Historial</button><button class="btn btnr" style="flex:1;font-size:11px" id="btn-rst">Reset</button></div></div>';

function bindEvents(){
  var bd=document.getElementById("btn-dark");
  if(bd)bd.addEventListener("click",function(){document.body.classList.toggle("dark");render();});
  var bw=document.getElementById("btn-wa");
  if(bw)bw.addEventListener("click",dlWA);

  if(bh)bh.addEventListener("click",verHistorial);

  document.querySelectorAll(".row").forEach(function(row){
    var p=row.dataset.p, n=row.dataset.n;
    var tog=row.querySelector("[data-action=tog]");
    if(tog)tog.addEventListener("click",function(){upd(p,n,"procesado",!gv(p,n,"procesado",false));});
    var sk=row.querySelector("[data-action=stock]");
    if(sk){sk.addEventListener("input",function(){updStock(p,n,this.value.replace(",","."));});sk.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();var inputs=Array.from(document.querySelectorAll("[data-action=stock]"));var i=inputs.indexOf(this);if(i>=0&&i<inputs.length-1)inputs[i+1].focus();}});}
    var pd=row.querySelector("[data-action=pedido]");
    if(pd)pd.addEventListener("input",function(){
      escribiendo=true;
      clearTimeout(escribiendoTimeout);
      escribiendoTimeout=setTimeout(function(){escribiendo=false;render();},3000);
      upd(p,n,"pedido",this.value,true);
    });
    var ed=row.querySelector("[data-action=edit]");
    if(ed)ed.addEventListener("click",function(){S.modal={p:p,o:n,nombre:n,min:this.dataset.min};render();});
    var dl=row.querySelector("[data-action=del]");
    if(dl)dl.addEventListener("click",function(){
      S.cat=S.cat.map(function(g){return g.p!==p?g:Object.assign({},g,{i:g.i.filter(function(i){return i.n!==n;})});}).filter(function(g){return g.i.length>0;});
      saveCat();render();
    });
  });
  // Botones
  var ba=document.getElementById("btn-all");
  if(ba)ba.addEventListener("click",function(){S.cat.forEach(function(g){g.i.forEach(function(i){upd(g.p,i.n,"procesado",true);});});});
  var bi=document.getElementById("btn-inv");
  if(bi)bi.addEventListener("click",dlInv);
  var bp=document.getElementById("btn-ped");
  if(bp)bp.addEventListener("click",dlPed);
  var br=document.getElementById("btn-rst");
  if(br)br.addEventListener("click",resetInv);
  var sp=document.getElementById("sel-prov");
  if(sp)sp.addEventListener("change",function(){S.ni.p=this.value;render();});
  var ap=document.getElementById("inp-ap");
  if(ap)ap.addEventListener("input",function(){S.ap=this.value.toUpperCase();});
  var nn=document.getElementById("inp-nn");
  if(nn)nn.addEventListener("input",function(){S.ni.n=this.value;});
  var nm=document.getElementById("inp-nm");
  if(nm)nm.addEventListener("input",function(){S.ni.m=this.value;});
  var ba2=document.getElementById("btn-add");
  if(ba2)ba2.addEventListener("click",function(){
    var prov=(S.ni.p==="__nuevo__"?S.ap:S.ni.p).toUpperCase();
    if(!prov||!S.ni.n.trim())return;
    var cat=S.cat.slice(),idx=cat.findIndex(function(g){return g.p===prov;});
    var item={n:S.ni.n.trim(),m:parseFloat(S.ni.m)||0};
    if(idx>=0)cat[idx]=Object.assign({},cat[idx],{i:cat[idx].i.concat([item])});
    else cat.push({p:prov,i:[item]});
    S.cat=cat;S.ni={p:"",n:"",m:""};S.ap="";
    saveCat();render();
  });
  var ce=document.getElementById("btn-ce");
  if(ce)ce.addEventListener("click",function(){S.modal=null;render();});
  var se=document.getElementById("btn-se");
  if(se)se.addEventListener("click",function(){
    var pr=S.modal.p,or=S.modal.o,nb=document.getElementById("em-n").value,mn=document.getElementById("em-m").value;
    S.cat=S.cat.map(function(g){return g.p!==pr?g:Object.assign({},g,{i:g.i.map(function(i){return i.n===or?{n:nb,m:parseFloat(mn)||0}:i;})});});
    S.modal=null;saveCat();render();
  });
}
function dlInv(){
  var lines=["Inventario - Gratinata Pizza","Semana: "+new Date().toLocaleDateString("es-CL"),""];
  S.cat.forEach(function(g){lines.push("== "+g.p+" ==");g.i.forEach(function(i){lines.push("["+(gv(g.p,i.n,"procesado",false)?"OK":" ")+"] "+i.n+" | Stock: "+(gv(g.p,i.n,"stock")||"-")+" | Min: "+i.m);});lines.push("");});
  var b=new Blob([lines.join("\n")],{type:"text/plain"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="inventario_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(u);
}
function savePedido(){
  var items=[];
  S.cat.forEach(function(g){
    g.i.forEach(function(i){
      var v=gv(g.p,i.n,"pedido","");
      if(v!=="")items.push({p:g.p,n:i.n,c:v});
    });
  });
  if(items.length===0)return;
  var key="pedido_"+new Date().toISOString().slice(0,10)+"_"+Date.now();
  var pedido={fecha:new Date().toLocaleDateString("es-CL"),items:items};
  db.collection("pedidos").doc(key).set(pedido).then(function(){
    limpiarPedidosAntiguos();
  });
}
function limpiarPedidosAntiguos(){
  var limite=new Date();
  limite.setDate(limite.getDate()-14);
  db.collection("pedidos").get().then(function(snap){
    snap.forEach(function(doc){
      var fecha=new Date(doc.id.split("_")[1]);
      if(fecha<limite)db.collection("pedidos").doc(doc.id).delete();
    });
  });
}
function verHistorial(){
  db.collection("pedidos").orderBy("__name__","desc").limit(10).get().then(function(snap){
    if(snap.empty){alert("No hay pedidos guardados");return;}
    var txt="=== HISTORIAL DE PEDIDOS ===\n\n";
    snap.forEach(function(doc){
      var d=doc.data();
      txt+=d.fecha+"\n";
      var provs={};
      d.items.forEach(function(i){if(!provs[i.p])provs[i.p]=[];provs[i.p].push(i);});
      Object.keys(provs).forEach(function(p){
        txt+=p+"\n";
        provs[p].forEach(function(i){txt+="  * "+i.c+" "+i.n+"\n";});
      });
      txt+="\n";
    });
    alert(txt);
  });
}
function dlWA(){
  var lines=[];
  S.cat.forEach(function(g){
    var its=g.i.filter(function(i){return gv(g.p,i.n,"pedido","")!=="";});
    if(its.length===0)return;
    lines.push("*"+g.p+"*");
    its.forEach(function(i){lines.push("* "+gv(g.p,i.n,"pedido","")+" "+i.n);});
    lines.push("");
  });
  if(lines.length===0){alert("No hay pedidos ingresados");return;}
  var txt=encodeURIComponent(lines.join("\n"));
  savePedido(); window.open("https://wa.me/56940624005?text="+txt,"_blank");
}
function dlPed(){
  var lines=[];
  S.cat.forEach(function(g){
    var its=g.i.filter(function(i){return gv(g.p,i.n,"pedido","")!=="";});
    if(its.length===0)return;
    lines.push(g.p);
    its.forEach(function(i){lines.push("* "+i.n+" "+gv(g.p,i.n,"pedido",""));});
    lines.push("");
  });
  if(lines.length===0){alert("No hay pedidos ingresados");return;}
  var b=new Blob([lines.join("\n")],{type:"text/plain"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="pedido_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(u);
}
load();
</script>
